<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    radial-gradient(circle at 50% 100%, #250038 0%, #090012 55%, #020006 100%);
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
}

#content {
  position: relative;
  z-index: 20;
  padding: 25px;
}

.message {
  font-size: clamp(30px, 8vw, 58px);
  font-weight: bold;
  line-height: 1.3;
  animation: appear .8s ease;
  text-shadow:
    0 0 10px #ff4fa3,
    0 0 25px #ff4fa3,
    0 0 50px #ff1493;
}

.tap {
  font-size: 22px;
  animation: blink 1.2s infinite;
  color: #ffd6ec;
}

#countdown {
  font-size: clamp(100px, 30vw, 180px);
  font-weight: bold;
  color: #ff4fa3;
  text-shadow:
    0 0 15px #ff4fa3,
    0 0 40px #ff1493,
    0 0 80px #ff1493;
  animation: countdownAnim .9s ease;
}


/* =========================
   ROKET
========================= */

#rocket {
  position: fixed;
  left: 50%;
  bottom: -180px;
  width: 90px;
  height: 190px;
  transform: translateX(-50%);
  z-index: 30;
  display: none;
}

/* Roket gövdesi */

.rocket-body {
  position: absolute;
  left: 50%;
  bottom: 30px;
  width: 58px;
  height: 125px;
  transform: translateX(-50%);
  border-radius: 50% 50% 18% 18%;
  background:
    linear-gradient(
      90deg,
      #8e8e8e 0%,
      #f5f5f5 25%,
      #ffffff 50%,
      #bdbdbd 75%,
      #707070 100%
    );
  box-shadow:
    inset -8px 0 10px rgba(0,0,0,.3),
    inset 8px 0 10px rgba(255,255,255,.7),
    0 0 15px rgba(255,255,255,.25);
}

/* Roket burun */

.rocket-nose {
  position: absolute;
  top: -25px;
  left: 0;
  width: 58px;
  height: 45px;
  background:
    linear-gradient(
      90deg,
      #777,
      #eee,
      #fff,
      #aaa
    );
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}

/* Roket pencere */

.rocket-window {
  position: absolute;
  top: 28px;
  left: 50%;
  width: 25px;
  height: 25px;
  transform: translateX(-50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #ffffff, #66d9ff 35%, #0759a5 100%);
  border: 4px solid #555;
  box-shadow:
    0 0 8px #4cc9ff,
    inset 0 0 5px #fff;
}

/* Roket gövde çizgileri */

.rocket-line {
  position: absolute;
  left: 0;
  width: 100%;
  height: 5px;
  background: #ff315f;
}

.rocket-line.one {
  top: 65px;
}

.rocket-line.two {
  top: 75px;
  background: #aaa;
}

/* Sol kanat */

.rocket-wing.left {
  position: absolute;
  bottom: 35px;
  left: 3px;
  width: 28px;
  height: 65px;
  background:
    linear-gradient(135deg, #ff315f, #9d0033);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
  transform: translateX(-20px);
}

/* Sağ kanat */

.rocket-wing.right {
  position: absolute;
  bottom: 35px;
  right: 3px;
  width: 28px;
  height: 65px;
  background:
    linear-gradient(225deg, #ff315f, #9d0033);
  clip-path: polygon(0 0, 100% 100%, 0 100%);
  transform: translateX(20px);
}

/* Motor */

.rocket-engine {
  position: absolute;
  left: 50%;
  bottom: 18px;
  width: 35px;
  height: 25px;
  transform: translateX(-50%);
  background: #333;
  border-radius: 0 0 12px 12px;
}


/* =========================
   ROKET ALEVİ
========================= */

#flame {
  position: fixed;
  left: 50%;
  bottom: -40px;
  width: 45px;
  height: 100px;
  transform: translateX(-50%);
  z-index: 29;
  display: none;
}

.flame-inner {
  position: absolute;
  left: 50%;
  top: 0;
  width: 32px;
  height: 90px;
  transform: translateX(-50%);
  border-radius: 50% 50% 60% 60%;
  background:
    linear-gradient(
      to bottom,
      #fff 0%,
      #ffe600 25%,
      #ff8c00 55%,
      #ff2400 100%
    );
  filter:
    blur(1px)
    drop-shadow(0 0 10px #ff8c00)
    drop-shadow(0 0 25px #ff4500);
}

.flame-inner::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -20px;
  width: 22px;
  height: 55px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #ff3300;
  filter: blur(8px);
}

.flame.show {
  display: block;
  animation: flameShake .08s infinite alternate;
}

@keyframes flameShake {
  from {
    transform: translateX(-50%) scaleY(1);
  }
  to {
    transform: translateX(-50%) scaleY(.72);
  }
}


/* =========================
   ROKET UÇUŞ
========================= */

.rocket-fly {
  display: block !important;
  animation:
    rocketFly 2.6s cubic-bezier(.35,.05,.2,1) forwards;
}

@keyframes rocketFly {

  0% {
    bottom: -180px;
    transform: translateX(-50%) rotate(0deg);
  }

  12% {
    transform: translateX(-50%) rotate(-3deg);
  }

  25% {
    transform: translateX(-50%) rotate(3deg);
  }

  40% {
    transform: translateX(-50%) rotate(-2deg);
  }

  55% {
    transform: translateX(-50%) rotate(2deg);
  }

  70% {
    transform: translateX(-50%) rotate(-1deg);
  }

  85% {
    transform: translateX(-50%) rotate(1deg);
  }

  100% {
    bottom: 58%;
    transform: translateX(-50%) rotate(0deg);
  }
}


/* =========================
   ROKET ARKASINDA DUMAN
========================= */

.smoke {
  position: fixed;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
  filter: blur(4px);
  pointer-events: none;
  z-index: 10;
  animation: smokeFade 1.1s ease-out forwards;
}

@keyframes smokeFade {
  0% {
    transform: scale(.5);
    opacity: .7;
  }

  100% {
    transform: scale(2.5);
    opacity: 0;
  }
}


/* =========================
   PATLAMA
========================= */

#blast {
  position: fixed;
  left: 50%;
  top: 42%;
  width: 20px;
  height: 20px;
  transform: translate(-50%, -50%) scale(0);
  border-radius: 50%;
  z-index: 35;
  pointer-events: none;
}

.blast-show {
  animation: blast 1.1s ease-out forwards;
}

@keyframes blast {

  0% {
    transform: translate(-50%, -50%) scale(.1);
    opacity: 1;
    background: white;
    box-shadow:
      0 0 10px white;
  }

  20% {
    transform: translate(-50%, -50%) scale(4);
    background: #fff;
    box-shadow:
      0 0 30px white,
      0 0 70px #ffcc00,
      0 0 120px #ff4500;
  }

  45% {
    transform: translate(-50%, -50%) scale(10);
    background: #ff7b00;
    opacity: .9;
  }

  100% {
    transform: translate(-50%, -50%) scale(28);
    background: #ff1493;
    opacity: 0;
  }
}


/* Patlama parçaları */

.explosion-piece {
  position: fixed;
  left: 50%;
  top: 42%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 34;
  background: #ffcc00;
  box-shadow:
    0 0 8px #ff6600,
    0 0 15px #ff1493;
  animation: pieceFly 1.2s ease-out forwards;
}

@keyframes pieceFly {

  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  100% {
    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(.1);
    opacity: 0;
  }
}


/* =========================
   KALP PATLAMASI
========================= */

#explosion {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 15;
}

.particle {
  position: fixed;
  font-size: 22px;
  pointer-events: none;
  opacity: 0;
  animation: particleFly 2.2s ease-out forwards;
}

@keyframes particleFly {

  0% {
    transform:
      translate(-50%, -50%)
      scale(.2);
    opacity: 1;
  }

  100% {
    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1.2);
    opacity: 0;
  }
}


/* =========================
   BÜYÜK KALP
========================= */

#bigHeart {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: clamp(150px, 55vw, 330px);
  z-index: 40;
  opacity: 0;
  filter:
    drop-shadow(0 0 15px #ff1493)
    drop-shadow(0 0 45px #ff1493)
    drop-shadow(0 0 80px #ff1493);
}

.big-heart-show {
  animation: bigHeartAppear 2s ease forwards;
}

@keyframes bigHeartAppear {

  0% {
    transform:
      translate(-50%, -50%)
      scale(0);
    opacity: 0;
  }

  45% {
    transform:
      translate(-50%, -50%)
      scale(1.25);
    opacity: 1;
  }

  65% {
    transform:
      translate(-50%, -50%)
      scale(.9);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1);
    opacity: 1;
  }
}


/* =========================
   GENEL ANİMASYONLAR
========================= */

@keyframes appear {

  from {
    opacity: 0;
    transform: scale(.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes blink {

  0%,100% {
    opacity: .35;
  }

  50% {
    opacity: 1;
  }
}

@keyframes countdownAnim {

  from {
    transform: scale(1.8);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}


/* Ekran sarsılması */

.screen-shake {
  animation: screenShake .35s;
}

@keyframes screenShake {

  0%   { transform: translate(0,0); }
  20%  { transform: translate(-8px,5px); }
  40%  { transform: translate(7px,-5px); }
  60%  { transform: translate(-5px,-3px); }
  80%  { transform: translate(5px,4px); }
  100% { transform: translate(0,0); }
}

</style>
</head>

<body>

<div id="screen">

  <div id="content">

    <div class="tap">
      Ekrana tıkla ❤️
    </div>

  </div>

</div>


<!-- ROKET -->

<div id="rocket">

  <div class="rocket-wing left"></div>
  <div class="rocket-wing right"></div>

  <div class="rocket-body">

    <div class="rocket-nose"></div>

    <div class="rocket-window"></div>

    <div class="rocket-line one"></div>
    <div class="rocket-line two"></div>

  </div>

  <div class="rocket-engine"></div>

</div>


<!-- ALEV -->

<div id="flame">

  <div class="flame-inner"></div>

</div>


<!-- PATLAMA -->

<div id="blast"></div>


<!-- KALP PARÇACIKLARI -->

<div id="explosion"></div>


<!-- BÜYÜK KALP -->

<div id="bigHeart">
  ❤️
</div>


<script>

const screen = document.getElementById("screen");
const content = document.getElementById("content");

const rocket = document.getElementById("rocket");
const flame = document.getElementById("flame");

const blast = document.getElementById("blast");
const explosion = document.getElementById("explosion");

const bigHeart = document.getElementById("bigHeart");

let step = 0;
let finished = false;

const messages = [

  "Tıkla Fatih... ❤️",

  "Sana bir şey söyleyeceğim...",

  "İyi ki...",

  "İyi ki seni tanımışım... 🥹",

  "Seni çok seviyorum...",

  "Pampimmmmmmm ❤️"

];


screen.addEventListener("click", function() {

  if (finished) return;


  if (step < messages.length) {

    content.innerHTML = `
      <div class="message">
        ${messages[step]}
      </div>
    `;

    step++;


    /*
      PAMPİMMMMMMM GELDİĞİ ANDA
      GERİ SAYIM BAŞLIYOR
    */

    if (step === messages.length) {

      setTimeout(() => {

        startCountdown();

      }, 500);

    }

  }

});


/* =========================
   GERİ SAYIM
========================= */

function startCountdown() {

  let number = 7;

  showNumber(number);


  const counter = setInterval(() => {

    number--;

    if (number > 0) {

      showNumber(number);

    } else {

      clearInterval(counter);

      content.innerHTML = "";

      launchRocket();

    }

  }, 1000);

}


function showNumber(number) {

  content.innerHTML = `
    <div id="countdown">
      ${number}
    </div>
  `;

}


/* =========================
   ROKET FIRLAT
========================= */

function launchRocket() {

  finished = true;

  rocket.classList.add("rocket-fly");

  flame.classList.add("show");


  /*
    Roket hareket ederken
    arkada duman oluştur
  */

  const smokeInterval = setInterval(() => {

    if (!rocket.classList.contains("rocket-fly")) {

      clearInterval(smokeInterval);

      return;

    }

    createSmoke();

  }, 90);


  /*
    2.6 saniye sonra roket patlar
  */

  setTimeout(() => {

    clearInterval(smokeInterval);

    rocket.style.display = "none";

    flame.style.display = "none";

    rocketExplosion();

  }, 2600);

}


/* =========================
   DUMAN
========================= */

function createSmoke() {

  const rect = rocket.getBoundingClientRect();

  const smoke = document.createElement("div");

  smoke.className = "smoke";

  smoke.style.left =
    (rect.left + rect.width / 2 - 9) + "px";

  smoke.style.top =
    (rect.bottom - 15) + "px";

  document.body.appendChild(smoke);


  setTimeout(() => {

    smoke.remove();

  }, 1100);

}


/* =========================
   ROKET PATLAMASI
========================= */

function rocketExplosion() {

  /*
    Önce beyaz/sarı gerçekçi patlama
  */

  blast.classList.remove("blast-show");

  void blast.offsetWidth;

  blast.classList.add("blast-show");


  /*
    Ekranı hafif salla
  */

  document.body.classList.add("screen-shake");

  setTimeout(() => {

    document.body.classList.remove("screen-shake");

  }, 400);


  /*
    Patlama kıvılcımları
  */

  for (let i = 0; i < 45; i++) {

    createExplosionPiece();

  }


  /*
    Patlamadan sonra kalp patlaması
  */

  setTimeout(() => {

    heartExplosion();

  }, 500);

}


/* =========================
   PATLAMA PARÇALARI
========================= */

function createExplosionPiece() {

  const piece =
    document.createElement("div");

  piece.className =
    "explosion-piece";


  const angle =
    Math.random() * Math.PI * 2;

  const distance =
    100 + Math.random() * 260;


  const x =
    Math.cos(angle) * distance;

  const y =
    Math.sin(angle) * distance;


  piece.style.setProperty(
    "--x",
    x + "px"
  );

  piece.style.setProperty(
    "--y",
    y + "px"
  );


  document.body.appendChild(piece);


  setTimeout(() => {

    piece.remove();

  }, 1300);

}


/* =========================
   KALP PATLAMASI
========================= */

function heartExplosion() {

  const centerX =
    window.innerWidth / 2;

  const centerY =
    window.innerHeight * .42;


  const heartSymbols = [

    "❤️",
    "💖",
    "💕",
    "💗",
    "💓",
    "💘"

  ];


  /*
    Matematiksel kalp eğrisi
  */

  for (let i = 0; i < 120; i++) {

    const t =
      Math.PI * 2 * (i / 120);


    const x =
      16 * Math.pow(
        Math.sin(t),
        3
      );


    const y =
      -(
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      );


    /*
      Biraz rastgelelik
      daha doğal patlama sağlar
    */

    const scale =
      15 + Math.random() * 5;


    createParticle(

      centerX,

      centerY,

      x * scale,

      y * scale

    );

  }


  /*
    Büyük kalp
  */

  setTimeout(() => {

    bigHeart.classList.add(
      "big-heart-show"
    );


    content.innerHTML = `
      <div class="message">
        Seni çok seviyorum Fatih ❤️
      </div>
    `;


    content.style.position =
      "fixed";

    content.style.left =
      "50%";

    content.style.top =
      "78%";

    content.style.transform =
      "translateX(-50%)";


  }, 900);

}


/* =========================
   KALP PARÇACIĞI
========================= */

function createParticle(
  startX,
  startY,
  x,
  y
) {

  const particle =
    document.createElement("div");


  particle.className =
    "particle";


  const symbols = [

    "❤️",
    "💖",
    "💕",
    "💗",
    "💓"

  ];


  particle.innerHTML =
    symbols[
      Math.floor(
        Math.random() *
        symbols.length
      )
    ];


  particle.style.left =
    startX + "px";


  particle.style.top =
    startY + "px";


  particle.style.setProperty(
    "--x",
    x + "px"
  );


  particle.style.setProperty(
    "--y",
    y + "px"
  );


  /*
    Parçacıkların boyutu
    biraz rastgele olsun
  */

  particle.style.fontSize =
    (16 + Math.random() * 18) + "px";


  explosion.appendChild(
    particle
  );


  setTimeout(() => {

    particle.remove();

  }, 2300);

}

</script>

</body>
</html>
