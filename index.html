<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 100%,
            #39004d 0%,
            #130018 45%,
            #050007 78%,
            #010002 100%
        );
    color:white;
    font-family:Arial,sans-serif;
}

/* =========================
   YILDIZLAR
========================= */

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 7px #fff;
    opacity:.5;
    animation:twinkle var(--speed) infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* =========================
   ANA EKRAN
========================= */

#screen{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    cursor:pointer;

    z-index:10;
}

#content{
    width:100%;
    padding:25px;
}

.message{
    font-size:clamp(30px,8vw,58px);
    font-weight:900;
    line-height:1.3;

    text-shadow:
        0 0 10px #ff67b7,
        0 0 25px #ff1493,
        0 0 55px #ff1493;

    animation:messageIn .7s ease;
}

.tap{
    font-size:22px;
    color:#ffd6eb;

    animation:blink 1.3s infinite;

    text-shadow:
        0 0 10px #ff1493;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:scale(.55);
        filter:blur(7px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes blink{
    0%,100%{
        opacity:.3;
    }

    50%{
        opacity:1;
    }
}

/* =========================
   PAMPİM + SAYI
========================= */

.pampim-area{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.countdown{
    margin-top:8px;

    font-size:clamp(85px,27vw,165px);
    font-weight:900;
    line-height:.9;

    color:#ff4fa7;

    text-shadow:
        0 0 15px #ff4fa7,
        0 0 40px #ff1493,
        0 0 90px #ff1493;

    animation:numberIn .55s ease;
}

@keyframes numberIn{
    from{
        opacity:0;
        transform:scale(1.6);
    }

    65%{
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =====================================================
   ROKET
===================================================== */

#rocketScene{
    position:fixed;
    inset:0;

    pointer-events:none;

    display:none;

    z-index:100;
}

#rocketScene.active{
    display:block;
}

/* Roketin kendisi */

#rocket{
    position:absolute;

    left:50%;
    bottom:-180px;

    width:70px;
    height:150px;

    transform:translateX(-50%);

    z-index:120;

    animation:rocketFlight 2.8s cubic-bezier(.42,0,.18,1) forwards;
}

/* Roket gövdesi */

.rocket-body{
    position:absolute;

    left:50%;
    top:25px;

    width:48px;
    height:105px;

    transform:translateX(-50%);

    border-radius:
        50% 50% 22% 22%;

    background:
        linear-gradient(
            90deg,
            #383840 0%,
            #bfc2ca 18%,
            #fff 45%,
            #e7e8ed 62%,
            #777982 100%
        );

    box-shadow:
        inset 4px 0 7px rgba(255,255,255,.8),
        inset -6px 0 9px rgba(0,0,0,.5),
        0 0 8px rgba(255,255,255,.3);
}

/* Burun */

.rocket-nose{
    position:absolute;

    left:0;
    top:-34px;

    width:48px;
    height:42px;

    background:
        linear-gradient(
            90deg,
            #55565e,
            #f6f6f8,
            #8c8d96
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

/* Cam */

.rocket-window{
    position:absolute;

    left:50%;
    top:25px;

    width:24px;
    height:24px;

    transform:translateX(-50%);

    border:4px solid #454650;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #65e4ff 25%,
            #0870ad 60%,
            #001b3d
        );

    box-shadow:
        0 0 10px #3ddfff,
        inset 0 0 5px white;
}

/* Kırmızı şerit */

.rocket-stripe{
    position:absolute;

    left:0;
    top:65px;

    width:100%;
    height:7px;

    background:
        linear-gradient(
            90deg,
            #e5003f,
            #ff7ca8,
            #e5003f
        );

    box-shadow:
        0 0 8px #ff174f;
}

/* Kanatlar */

.rocket-wing{
    position:absolute;

    bottom:17px;

    width:34px;
    height:62px;

    background:
        linear-gradient(
            135deg,
            #ff315f,
            #72001f
        );

    z-index:-1;
}

.rocket-wing.left{
    left:0;

    transform:
        translateX(-27px)
        skewY(9deg);

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.rocket-wing.right{
    right:0;

    transform:
        translateX(27px)
        skewY(-9deg);

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

/* Motor */

.rocket-engine{
    position:absolute;

    left:50%;
    bottom:13px;

    width:27px;
    height:19px;

    transform:translateX(-50%);

    border-radius:0 0 8px 8px;

    background:#24242b;
}

/* =========================
   ROKET UÇUŞU
========================= */

@keyframes rocketFlight{

    0%{
        bottom:-180px;
        transform:translateX(-50%) rotate(-2deg);
    }

    12%{
        transform:translateX(-50%) rotate(2deg);
    }

    25%{
        transform:translateX(-50%) rotate(-1.5deg);
    }

    38%{
        transform:translateX(-50%) rotate(1deg);
    }

    50%{
        transform:translateX(-50%) rotate(-.8deg);
    }

    65%{
        transform:translateX(-50%) rotate(.5deg);
    }

    80%{
        transform:translateX(-50%) rotate(-.25deg);
    }

    100%{
        bottom:58%;
        transform:translateX(-50%) rotate(0);
    }
}

/* =====================================================
   MOTOR ALEVİ
===================================================== */

#rocketFlame{
    position:absolute;

    left:50%;
    bottom:-80px;

    width:55px;
    height:125px;

    transform:translateX(-50%);

    z-index:110;

    animation:
        flameFlight
        2.8s
        cubic-bezier(.42,0,.18,1)
        forwards;
}

.flame-main{
    position:absolute;

    left:50%;
    top:0;

    width:43px;
    height:110px;

    transform:translateX(-50%);

    border-radius:
        50% 50% 45% 45%;

    background:
        linear-gradient(
            to bottom,
            #ffffff 0%,
            #fff700 18%,
            #ffae00 42%,
            #ff4a00 68%,
            transparent 100%
        );

    filter:
        blur(2px)
        drop-shadow(0 0 12px #ffb000)
        drop-shadow(0 0 28px #ff4000);

    animation:flamePulse .08s infinite alternate;
}

.flame-inner{
    position:absolute;

    left:50%;
    top:4px;

    width:19px;
    height:75px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffffa0,
            #ff8b00,
            transparent
        );
}

@keyframes flamePulse{
    from{
        transform:
            translateX(-50%)
            scaleY(1)
            scaleX(.9);
    }

    to{
        transform:
            translateX(-50%)
            scaleY(.72)
            scaleX(1.08);
    }
}

@keyframes flameFlight{

    0%{
        bottom:-80px;
    }

    100%{
        bottom:calc(58% - 75px);
    }
}

/* =====================================================
   DUMAN / TOZ İZİ
===================================================== */

#smokeTrail{
    position:absolute;
    inset:0;

    overflow:hidden;

    z-index:90;
}

.smoke{
    position:absolute;

    width:var(--size);
    height:var(--size);

    left:50%;
    bottom:var(--bottom);

    margin-left:var(--offset);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,210,235,.35) 0%,
            rgba(210,120,180,.22) 35%,
            rgba(110,60,110,.13) 60%,
            transparent 75%
        );

    filter:blur(4px);

    animation:
        smokeRise
        var(--duration)
        ease-out
        forwards;
}

@keyframes smokeRise{

    0%{
        opacity:0;
        transform:scale(.3) translateX(0);
    }

    15%{
        opacity:.7;
    }

    100%{
        opacity:0;
        transform:
            scale(2.8)
            translateX(var(--drift));
    }
}

/* =====================================================
   PATLAMA FLASH
===================================================== */

#blast{
    position:absolute;

    left:50%;
    top:42%;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    transform:
        translate(-50%,-50%)
        scale(.1);

    opacity:0;

    z-index:180;
}

#blast.active{
    animation:blastFlash .55s ease-out forwards;
}

@keyframes blastFlash{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    8%{
        opacity:1;
    }

    25%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(7);

        box-shadow:
            0 0 25px white,
            0 0 60px #fff000,
            0 0 130px #ff6500;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(17);
    }
}

/* =====================================================
   PATLAMA ALEVİ
===================================================== */

.blastFire{
    position:absolute;

    left:50%;
    top:42%;

    width:var(--size);
    height:var(--size);

    margin-left:calc(var(--size) / -2);
    margin-top:calc(var(--size) / -2);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #fff000 20%,
            #ff8b00 48%,
            #ff2600 70%,
            transparent 75%
        );

    filter:
        blur(1px)
        drop-shadow(0 0 10px #ff6800);

    animation:
        fireBurst
        .9s
        ease-out
        forwards;
}

@keyframes fireBurst{

    0%{
        opacity:1;
        transform:translate(0,0) scale(.2);
    }

    100%{
        opacity:0;
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.05);
    }
}

/* =====================================================
   EKRAN SARSINTISI
===================================================== */

body.shake{
    animation:screenShake .32s ease;
}

@keyframes screenShake{

    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-8px,4px);
    }

    40%{
        transform:translate(8px,-5px);
    }

    60%{
        transform:translate(-5px,-3px);
    }

    80%{
        transform:translate(5px,3px);
    }

    100%{
        transform:translate(0,0);
    }
}

/* =====================================================
   KALP PARÇACIKLARI
===================================================== */

#heartParticles{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:200;
}

.heartParticle{
    position:absolute;

    left:50%;
    top:42%;

    font-size:var(--size);

    opacity:0;

    filter:
        drop-shadow(0 0 5px #ff4fa3)
        drop-shadow(0 0 14px #ff1493);

    animation:
        heartBuild
        1.7s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes heartBuild{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.05);
    }

    15%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);
    }
}

/* =====================================================
   BÜYÜK KALP
===================================================== */

#bigHeart{
    position:fixed;

    left:50%;
    top:42%;

    width:min(75vw,380px);
    height:min(75vw,380px);

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    pointer-events:none;

    z-index:190;
}

#bigHeart::before{
    content:"❤️";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:min(75vw,380px);

    line-height:1;

    opacity:.22;

    filter:
        drop-shadow(0 0 12px #ff1493)
        drop-shadow(0 0 35px #ff1493)
        drop-shadow(0 0 80px #ff1493);
}

#bigHeart.show{
    animation:heartAppear 1.2s ease-out forwards;
}

@keyframes heartAppear{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    55%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    75%{
        transform:
            translate(-50%,-50%)
            scale(.96);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* =====================================================
   KALP ATIŞI
===================================================== */

#bigHeart.beat{
    animation:heartBeat .75s cubic-bezier(.2,.8,.25,1.3);
}

@keyframes heartBeat{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    20%{
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    38%{
        transform:
            translate(-50%,-50%)
            scale(.94);
    }

    55%{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    75%{
        transform:
            translate(-50%,-50%)
            scale(.98);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* =====================================================
   KALP IŞIK HALKASI
===================================================== */

.heartRing{
    position:fixed;

    left:50%;
    top:42%;

    width:30px;
    height:30px;

    border:2px solid #ff64b6;

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:.9;

    z-index:210;

    pointer-events:none;

    animation:ringOut .8s ease-out forwards;
}

@keyframes ringOut{

    0%{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(4);
    }
}

/* =====================================================
   FİNAL YAZISI
===================================================== */

#finalText{
    position:fixed;

    left:50%;
    top:76%;

    width:95%;

    transform:
        translate(-50%,25px)
        scale(.9);

    opacity:0;

    text-align:center;

    z-index:300;

    animation:finalAppear 1.1s ease forwards;
}

.final-main{
    font-size:clamp(25px,6vw,50px);
    font-weight:900;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 25px #ff1493,
        0 0 50px #ff1493;
}

.final-sub{
    margin-top:9px;

    font-size:clamp(19px,5vw,31px);

    color:#ffc4df;

    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;
}

@keyframes finalAppear{

    from{
        opacity:0;

        transform:
            translate(-50%,25px)
            scale(.9);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,0)
            scale(1);
    }
}

</style>
</head>

<body>

<div id="stars"></div>

<div id="screen">

    <div id="content">

        <div class="tap">
            Ekrana tıkla ❤️
        </div>

    </div>

</div>


<!-- =====================================================
     ROKET SAHNESİ
===================================================== -->

<div id="rocketScene">

    <div id="smokeTrail"></div>

    <div id="rocket">

        <div class="rocket-wing left"></div>
        <div class="rocket-wing right"></div>

        <div class="rocket-body">

            <div class="rocket-nose"></div>

            <div class="rocket-window"></div>

            <div class="rocket-stripe"></div>

        </div>

        <div class="rocket-engine"></div>

    </div>


    <div id="rocketFlame">

        <div class="flame-main"></div>
        <div class="flame-inner"></div>

    </div>


    <div id="blast"></div>

</div>


<div id="heartParticles"></div>

<div id="bigHeart"></div>


<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const screen =
    document.getElementById("screen");

const content =
    document.getElementById("content");

const rocketScene =
    document.getElementById("rocketScene");

const rocket =
    document.getElementById("rocket");

const rocketFlame =
    document.getElementById("rocketFlame");

const smokeTrail =
    document.getElementById("smokeTrail");

const blast =
    document.getElementById("blast");

const heartParticles =
    document.getElementById("heartParticles");

const bigHeart =
    document.getElementById("bigHeart");


let step=0;
let finished=false;


/* =====================================================
   YILDIZLAR
===================================================== */

for(let i=0;i<120;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.setProperty(
        "--speed",
        (1.5+Math.random()*3)+"s"
    );

    document
        .getElementById("stars")
        .appendChild(star);
}


/* =====================================================
   MESAJLAR
===================================================== */

const messages=[

    "Tıkla Fatih... ❤️",

    "Sana bir şey söyleyeceğim...",

    "İyi ki...",

    "İyi ki seni tanımışım... 🥹",

    "Seni çok seviyorum..."

];


/* =====================================================
   TIKLAMALAR
===================================================== */

screen.addEventListener("click",()=>{

    if(finished)
        return;


    /*
       İlk 5 mesaj normal şekilde ilerler.
    */

    if(step < messages.length){

        content.innerHTML=`

            <div class="message">
                ${messages[step]}
            </div>

        `;

        step++;


        /*
           Mesajların sonuna gelince
           bir sonraki tıklamada Pampim gösterilir.
        */

        if(step === messages.length){

            setTimeout(()=>{

                if(finished)
                    return;

                content.innerHTML=`

                    <div class="pampim-area">

                        <div class="message">
                            Pampimmmmmmm ❤️
                        </div>

                        <div
                            class="countdown"
                            id="countdown"
                        >
                            7
                        </div>

                    </div>

                `;

                startCountdown();

            },250);

        }

    }

});


/* =====================================================
   GERİ SAYIM
===================================================== */

function startCountdown(){

    let number=7;

    const timer =
        setInterval(()=>{

            number--;


            if(number>0){

                const counter =
                    document.getElementById(
                        "countdown"
                    );

                if(counter){

                    counter.textContent=
                        number;

                    counter.style.animation="none";

                    void counter.offsetWidth;

                    counter.style.animation=
                        "numberIn .55s ease";
                }

            }
            else{

                clearInterval(timer);

                content.innerHTML="";

                launchRocket();

            }

        },1000);

}


/* =====================================================
   ROKETİ BAŞLAT
===================================================== */

function launchRocket(){

    finished=true;

    rocketScene.classList.add("active");

    createSmokeLoop();

}


/* =====================================================
   DUMAN ÜRETİMİ
===================================================== */

let smokeTimer;

function createSmokeLoop(){

    let elapsed=0;


    smokeTimer =
        setInterval(()=>{

            elapsed+=90;


            if(elapsed>2850){

                clearInterval(smokeTimer);

                return;
            }


            const smoke =
                document.createElement("div");

            smoke.className="smoke";


            smoke.style.setProperty(
                "--size",
                (18+Math.random()*32)+"px"
            );


            smoke.style.setProperty(
                "--bottom",
                (
                    -10 +
                    Math.min(
                        elapsed/2850,
                        1
                    )*58
                )+"%"
            );


            smoke.style.setProperty(
                "--offset",
                (-20+Math.random()*40)+"px"
            );


            smoke.style.setProperty(
                "--drift",
                (-50+Math.random()*100)+"px"
            );


            smoke.style.setProperty(
                "--duration",
                (1.2+Math.random()*.8)+"s"
            );


            smokeTrail.appendChild(smoke);


            setTimeout(()=>{

                smoke.remove();

            },2200);


        },90);

}


/* =====================================================
   ROKET ANİMASYON BİTTİĞİ ANDA PATLA
===================================================== */

rocket.addEventListener(
    "animationend",
    explodeRocket
);


function explodeRocket(){

    /*
       ÖNEMLİ:
       Roketi anında görünmez yapıyoruz.
       Böylece patlamadan sonra roket ekranda
       kalmıyor veya dönmüyor.
    */

    rocket.style.display="none";

    rocketFlame.style.display="none";


    clearInterval(smokeTimer);


    /*
       Patlama.
    */

    blast.classList.remove("active");

    void blast.offsetWidth;

    blast.classList.add("active");


    document.body.classList.add("shake");


    setTimeout(()=>{

        document.body.classList.remove("shake");

    },350);


    createExplosionFire();


    /*
       Patlama biter bitmez kalp oluşmaya başlıyor.
       Uzun bekleme yok.
    */

    setTimeout(()=>{

        createHeart();

    },430);

}


/* =====================================================
   PATLAMA ATEŞİ
===================================================== */

function createExplosionFire(){

    const colors=[
        "#ffffff",
        "#fff700",
        "#ffd000",
        "#ff8c00",
        "#ff4500",
        "#ff1700"
    ];


    for(let i=0;i<90;i++){

        const particle =
            document.createElement("div");

        particle.className="blastFire";


        const angle =
            Math.random()*Math.PI*2;

        const distance =
            60+Math.random()*300;


        particle.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        particle.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );


        particle.style.setProperty(
            "--size",
            (5+Math.random()*18)+"px"
        );


        particle.style.background=
            `radial-gradient(
                circle,
                #fff 0%,
                ${colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ]} 35%,
                #ff2600 70%,
                transparent 75%
            )`;


        rocketScene.appendChild(
            particle
        );


        setTimeout(()=>{

            particle.remove();

        },1000);

    }

}


/* =====================================================
   KALP NOKTASI
===================================================== */

function heartPoint(t){

    return {

        x:
            16*
            Math.pow(
                Math.sin(t),
                3
            ),

        y:
            -(
                13*Math.cos(t)
                -
                5*Math.cos(2*t)
                -
                2*Math.cos(3*t)
                -
                Math.cos(4*t)
            )

    };

}


/* =====================================================
   KALBİ OLUŞTUR
===================================================== */

function createHeart(){

    /*
       Önce dış çizgi.
    */

    for(let i=0;i<170;i++){

        const t=
            Math.PI*2*i/170;

        const p=
            heartPoint(t);


        createHeartParticle(
            p.x*12,
            p.y*12
        );

    }


    /*
       Sonra kalbin içini doldur.
    */

    for(let i=0;i<260;i++){

        const t=
            Math.random()*Math.PI*2;

        const p=
            heartPoint(t);

        const scale=
            .12+Math.random()*.82;


        createHeartParticle(
            p.x*12*scale,
            p.y*12*scale
        );

    }


    /*
       Silik büyük kalp.
    */

    setTimeout(()=>{

        bigHeart.classList.add("show");

    },350);


    /*
       Kalp atışları.
    */

    setTimeout(()=>{

        beatHeart();

    },1450);


    setTimeout(()=>{

        beatHeart();

    },2200);


    setTimeout(()=>{

        beatHeart();

    },2950);


    /*
       Final yazısı.
    */

    setTimeout(()=>{

        showFinal();

    },3800);

}


/* =====================================================
   KALP PARÇASI
===================================================== */

function createHeartParticle(x,y){

    const particle =
        document.createElement("div");

    particle.className=
        "heartParticle";


    const symbols=[
        "❤️",
        "💗",
        "💖",
        "💕"
    ];


    particle.textContent=
        symbols[
            Math.floor(
                Math.random()*symbols.length
            )
        ];


    particle.style.setProperty(
        "--x",
        x+"px"
    );

    particle.style.setProperty(
        "--y",
        y+"px"
    );


    particle.style.setProperty(
        "--size",
        (7+Math.random()*12)+"px"
    );


    heartParticles.appendChild(
        particle
    );


    setTimeout(()=>{

        particle.remove();

    },3000);

}


/* =====================================================
   KALP ATIŞI
===================================================== */

function beatHeart(){

    bigHeart.classList.remove("beat");

    void bigHeart.offsetWidth;

    bigHeart.classList.add("beat");


    createRing();

}


/* =====================================================
   IŞIK HALKASI
===================================================== */

function createRing(){

    const ring =
        document.createElement("div");

    ring.className="heartRing";

    document.body.appendChild(ring);


    setTimeout(()=>{

        ring.remove();

    },900);

}


/* =====================================================
   FİNAL
===================================================== */

function showFinal(){

    const final =
        document.createElement("div");

    final.id="finalText";


    final.innerHTML=`

        <div class="final-main">
            Seni çok seviyorum Fatih ❤️
        </div>

        <div class="final-sub">
            Pampimmmmmmm 🥹❤️
        </div>

    `;


    document.body.appendChild(final);

}
