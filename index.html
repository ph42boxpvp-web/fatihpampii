<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: linear-gradient(135deg, #14001f, #3b073f, #12001b);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  user-select: none;
}

#screen {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  cursor: pointer;
}

#content {
  max-width: 90%;
}

.tap {
  font-size: 20px;
  opacity: .8;
  animation: blink 1.3s infinite;
}

.message {
  font-size: clamp(28px, 8vw, 50px);
  font-weight: bold;
  line-height: 1.3;
  animation: appear .8s ease;
  text-shadow: 0 0 20px rgba(255,100,200,.7);
}

#countdown {
  font-size: clamp(80px, 25vw, 160px);
  font-weight: bold;
  color: #ff4fa3;
  text-shadow:
    0 0 10px #ff4fa3,
    0 0 30px #ff4fa3,
    0 0 60px #ff0080;
  animation: count .9s ease;
}

#fireworks {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.heart {
  position: fixed;
  font-size: 35px;
  pointer-events: none;
  animation: heartFly 3s ease-out forwards;
  z-index: 20;
}

.spark {
  position: fixed;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  pointer-events: none;
  animation: explode 1.5s ease-out forwards;
  z-index: 10;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes blink {
  0%,100% { opacity: .3; }
  50% { opacity: 1; }
}

@keyframes count {
  0% {
    transform: scale(1.8);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes explode {
  0% {
    transform: translate(0,0) scale(1);
    opacity: 1;
  }

  100% {
    transform: translate(var(--x), var(--y)) scale(.1);
    opacity: 0;
  }
}

@keyframes heartFly {
  0% {
    transform: translate(0,0) scale(.5) rotate(0deg);
    opacity: 1;
  }

  100% {
    transform:
      translate(var(--x), var(--y))
      scale(1.4)
      rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="screen">
  <div id="content">
    <div class="tap">Ekrana tıkla ❤️</div>
  </div>
</div>

<div id="fireworks"></div>

<script>

const screen = document.getElementById("screen");
const content = document.getElementById("content");

let step = 0;

const messages = [
  "Tıkla Fatih... ❤️",
  "Sana bir şey söyleyeceğim...",
  "İyi ki...",
  "İyi ki seni tanımışım... 🥹",
  "Seni çok seviyorum...",
  "Pampimmmmmmm ❤️"
];

screen.addEventListener("click", () => {

  if (step < messages.length) {

    content.innerHTML = `
      <div class="message">
        ${messages[step]}
      </div>
    `;

    step++;

    // Son yazıdan sonra 7 saniye bekle
    if (step === messages.length) {
      setTimeout(startCountdown, 7000);
    }
  }

});

function startCountdown() {

  let number = 7;

  content.innerHTML = `
    <div id="countdown">${number}</div>
  `;

  const timer = setInterval(() => {

    number--;

    if (number > 0) {

      content.innerHTML = `
        <div id="countdown">${number}</div>
      `;

    } else {

      clearInterval(timer);

      content.innerHTML = `
        <div class="message">
          ❤️ PAMPİMMM ❤️
        </div>
      `;

      launchFireworks();
    }

  }, 1000);
}


function launchFireworks() {

  // Birden fazla havai fişek
  for (let i = 0; i < 12; i++) {

    setTimeout(() => {

      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight * .65;

      createFirework(x, y);

    }, i * 350);
  }

  // Kalp yağmuru
  for (let i = 0; i < 100; i++) {

    setTimeout(() => {
      createHeart();
    }, i * 70);

  }
}


function createFirework(x, y) {

  const colors = [
    "#ff4fa3",
    "#ffcc00",
    "#00ffff",
    "#ffffff",
    "#ff6b6b",
    "#a855f7"
  ];

  for (let i = 0; i < 45; i++) {

    const spark = document.createElement("div");

    spark.className = "spark";

    const angle = Math.random() * Math.PI * 2;
    const distance = 70 + Math.random() * 180;

    const moveX = Math.cos(angle) * distance;
    const moveY = Math.sin(angle) * distance;

    spark.style.left = x + "px";
    spark.style.top = y + "px";

    spark.style.background =
      colors[Math.floor(Math.random() * colors.length)];

    spark.style.boxShadow =
      "0 0 10px " + spark.style.background;

    spark.style.setProperty("--x", moveX + "px");
    spark.style.setProperty("--y", moveY + "px");

    document.getElementById("fireworks").appendChild(spark);

    setTimeout(() => {
      spark.remove();
    }, 1600);
  }
}


function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";

  const hearts = [
    "❤️",
    "💖",
    "💕",
    "💗",
    "💓",
    "💘",
    "🥰"
  ];

  heart.innerHTML =
    hearts[Math.floor(Math.random() * hearts.length)];

  const startX = Math.random() * window.innerWidth;
  const startY = window.innerHeight + 30;

  const moveX =
    (Math.random() - .5) * 500;

  const moveY =
    -(300 + Math.random() * 600);

  heart.style.left = startX + "px";
  heart.style.top = startY + "px";

  heart.style.setProperty("--x", moveX + "px");
  heart.style.setProperty("--y", moveY + "px");

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 3000);
}

</script>

</body>
</html>
