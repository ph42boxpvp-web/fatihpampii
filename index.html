<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 100%,
            #48005e 0%,
            #18001f 42%,
            #07000b 75%,
            #010003 100%
        );
    color:white;
    font-family:Arial,sans-serif;
}

/* =========================
   YILDIZLAR
========================= */

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 6px white;
    animation:twinkle var(--t) infinite alternate ease-in-out;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* =========================
   EKRAN
========================= */

#screen{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    cursor:pointer;
}

#content{
    width:100%;
    padding:25px;
    z-index:20;
}

.message{
    font-size:clamp(30px,8vw,58px);
    font-weight:900;
    line-height:1.3;

    text-shadow:
        0 0 10px #ff67b7,
        0 0 25px #ff1493,
        0 0 55px #ff1493;

    animation:messageIn .8s ease;
}

.tap{
    font-size:22px;
    color:#ffd7eb;

    text-shadow:0 0 12px #ff1493;

    animation:tapPulse 1.4s infinite;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:scale(.5);
        filter:blur(8px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes tapPulse{
    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:1;
    }
}

/* =========================
   PAMPİM + SAYI
========================= */

#pampimArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

#countdown{
    font-size:clamp(90px,27vw,170px);
    line-height:1;

    color:#ff4fa7;

    font-weight:900;

    text-shadow:
        0 0 15px #ff4fa7,
        0 0 40px #ff1493,
        0 0 90px #ff1493;

    animation:numberIn .65s ease;
}

@keyframes numberIn{
    from{
        opacity:0;
        transform:scale(1.7);
    }

    70%{
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   ROKET
========================= */

#rocket{
    position:fixed;

    left:50%;
    bottom:-240px;

    width:90px;
    height:190px;

    transform:translateX(-50%);

    display:none;

    z-index:50;
}

#rocket.fly{
    display:block;
    animation:rocketFly 3.2s linear forwards;
}

.rocket-body{
    position:absolute;

    left:50%;
    bottom:35px;

    width:55px;
    height:125px;

    transform:translateX(-50%);

    border-radius:
        50% 50% 20% 20%;

    background:
        linear-gradient(
            90deg,
            #3d3d45,
            #eeeeee 25%,
            #ffffff 50%,
            #bfc2cc 75%,
            #3c3c44
        );

    box-shadow:
        inset 4px 0 7px white,
        inset -6px 0 10px #222;
}

.nose{
    position:absolute;

    top:-35px;
    left:0;

    width:55px;
    height:45px;

    background:
        linear-gradient(
            90deg,
            #555,
            #fff,
            #aaa
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.window{
    position:absolute;

    left:50%;
    top:27px;

    width:26px;
    height:26px;

    transform:translateX(-50%);

    border:4px solid #4b4b55;
    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #55ddff 25%,
            #0064a7 65%,
            #001b42
        );

    box-shadow:
        0 0 10px #49dfff;
}

.stripe{
    position:absolute;

    top:68px;
    left:0;

    width:100%;
    height:7px;

    background:
        linear-gradient(
            90deg,
            #ff003d,
            #ff6a9c,
            #ff003d
        );

    box-shadow:0 0 8px #ff174f;
}

.wing{
    position:absolute;

    bottom:38px;

    width:35px;
    height:65px;

    background:
        linear-gradient(
            135deg,
            #ff315f,
            #70001f
        );

    z-index:-1;
}

.wing.left{
    left:3px;

    transform:
        translateX(-28px)
        skewY(10deg);

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.wing.right{
    right:3px;

    transform:
        translateX(28px)
        skewY(-10deg);

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.engine{
    position:absolute;

    left:50%;
    bottom:18px;

    width:30px;
    height:20px;

    transform:translateX(-50%);

    background:#202027;

    border-radius:0 0 10px 10px;
}

@keyframes rocketFly{

    0%{
        bottom:-240px;
        transform:translateX(-50%) rotate(-2deg);
    }

    15%{
        transform:translateX(-50%) rotate(2deg);
    }

    30%{
        transform:translateX(-50%) rotate(-1.5deg);
    }

    45%{
        transform:translateX(-50%) rotate(1deg);
    }

    60%{
        transform:translateX(-50%) rotate(-.5deg);
    }

    100%{
        bottom:58%;
        transform:translateX(-50%) rotate(0deg);
    }
}

/* =========================
   ALEV
========================= */

#flame{
    position:fixed;

    left:50%;
    bottom:-80px;

    width:45px;
    height:125px;

    transform:translateX(-50%);

    display:none;

    z-index:45;
}

#flame.show{
    display:block;
    animation:flameMove .08s infinite alternate;
}

.flame-outer{
    position:absolute;

    left:50%;
    top:0;

    width:42px;
    height:120px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            white,
            #fff000 20%,
            #ff8c00 50%,
            #ff2600 80%,
            transparent
        );

    filter:
        blur(2px)
        drop-shadow(0 0 15px #ff8c00)
        drop-shadow(0 0 35px #ff3300);
}

.flame-inner{
    position:absolute;

    left:50%;
    top:3px;

    width:20px;
    height:90px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            white,
            #fff79a,
            #ff7900
        );
}

@keyframes flameMove{
    from{
        transform:translateX(-50%) scaleY(1);
    }

    to{
        transform:translateX(-50%) scaleY(.7) scaleX(1.1);
    }
}

/* =========================
   PATLAMA
========================= */

#explosionFlash{
    position:fixed;

    left:50%;
    top:42%;

    width:20px;
    height:20px;

    border-radius:50%;

    background:white;

    transform:translate(-50%,-50%) scale(0);

    opacity:0;

    pointer-events:none;

    z-index:100;
}

#explosionFlash.active{
    animation:flash .6s ease-out forwards;
}

@keyframes flash{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.1);
    }

    10%{
        opacity:1;
        transform:translate(-50%,-50%) scale(4);

        box-shadow:
            0 0 40px white,
            0 0 100px #ffd000,
            0 0 180px #ff4500;
    }

    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(10);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(18);
    }
}

/* =========================
   PATLAMA PARÇALARI
========================= */

.explosionParticle{
    position:fixed;

    left:50%;
    top:42%;

    width:var(--size);
    height:var(--size);

    border-radius:50%;

    pointer-events:none;

    z-index:95;

    animation:
        particleExplosion
        1.15s
        ease-out
        forwards;
}

@keyframes particleExplosion{

    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity:0;
    }
}

/* =========================
   KALP PARÇACIKLARI
========================= */

#heartParticles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:110;
}

.heartParticle{
    position:fixed;

    left:50%;
    top:42%;

    font-size:var(--size);

    opacity:0;

    filter:
        drop-shadow(0 0 5px #ff4fa3)
        drop-shadow(0 0 15px #ff1493);

    animation:
        heartForm
        1.8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes heartForm{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.1);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);

        opacity:1;
    }
}

/* =========================
   SİLİK BÜYÜK KALP
========================= */

#bigHeart{
    position:fixed;

    left:50%;
    top:42%;

    width:min(72vw,360px);
    height:min(72vw,360px);

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    z-index:105;

    pointer-events:none;
}

#bigHeart::before{
    content:"❤";

    position:absolute;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:min(72vw,360px);

    line-height:1;

    color:#ff1590;

    opacity:.14;

    filter:
        drop-shadow(0 0 12px #ff1493)
        drop-shadow(0 0 35px #ff1493)
        drop-shadow(0 0 80px #ff1493);
}

#bigHeart.show{
    animation:bigHeartAppear 1.7s ease forwards;
}

@keyframes bigHeartAppear{

    0%{
        transform:translate(-50%,-50%) scale(.15);
        opacity:0;
    }

    60%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }

    80%{
        transform:translate(-50%,-50%) scale(.96);
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }
}

/* =========================
   KALP ATIŞI
========================= */

#bigHeart.beat{
    animation:heartBeat .7s cubic-bezier(.2,.8,.25,1.3);
}

@keyframes heartBeat{

    0%{
        transform:translate(-50%,-50%) scale(1);
    }

    20%{
        transform:translate(-50%,-50%) scale(1.16);
    }

    38%{
        transform:translate(-50%,-50%) scale(.94);
    }

    55%{
        transform:translate(-50%,-50%) scale(1.08);
    }

    75%{
        transform:translate(-50%,-50%) scale(.98);
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* =========================
   İKİNCİ KALP
========================= */

#innerHeart{
    position:fixed;

    left:50%;
    top:42%;

    z-index:140;

    font-size:clamp(65px,20vw,125px);

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    pointer-events:none;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 20px #ff54ad)
        drop-shadow(0 0 45px #ff1493);
}

#innerHeart.show{
    animation:
        innerHeartIn
        1.5s
        cubic-bezier(.15,.8,.2,1)
        forwards;
}

@keyframes innerHeartIn{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }

    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.5);
    }

    60%{
        transform:translate(-50%,-50%) scale(1.2);
    }

    78%{
        transform:translate(-50%,-50%) scale(.9);
    }

    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* İÇ KALP ATIŞI */

#innerHeart.beat{
    animation:
        innerBeat
        .7s
        cubic-bezier(.2,.8,.25,1.3);
}

@keyframes innerBeat{

    0%{
        transform:translate(-50%,-50%) scale(1);
    }

    20%{
        transform:translate(-50%,-50%) scale(1.25);
    }

    40%{
        transform:translate(-50%,-50%) scale(.9);
    }

    58%{
        transform:translate(-50%,-50%) scale(1.12);
    }

    78%{
        transform:translate(-50%,-50%) scale(.97);
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* =========================
   IŞIK HALKASI
========================= */

.ring{
    position:fixed;

    left:50%;
    top:42%;

    width:40px;
    height:40px;

    border:2px solid #ff55ad;

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:.8;

    pointer-events:none;

    z-index:130;

    animation:ring .9s ease-out forwards;
}

@keyframes ring{

    from{
        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity:.9;
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(4);

        opacity:0;
    }
}

/* =========================
   FİNAL
========================= */

#finalText{
    position:fixed;

    left:50%;
    top:76%;

    width:95%;

    transform:translate(-50%,20px);

    text-align:center;

    opacity:0;

    z-index:200;

    animation:finalIn 1.2s ease forwards;
}

.finalMain{
    font-size:clamp(25px,6vw,50px);
    font-weight:900;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 25px #ff1493,
        0 0 50px #ff1493;
}

.finalSub{
    margin-top:8px;

    font-size:clamp(19px,5vw,32px);

    color:#ffc0df;

    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;
}

@keyframes finalIn{

    from{
        opacity:0;
        transform:
            translate(-50%,30px)
            scale(.9);
    }

    to{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }
}

/* =========================
   EKRAN SARSINTISI
========================= */

body.shake{
    animation:shake .35s ease;
}

@keyframes shake{

    0%{transform:translate(0,0);}
    20%{transform:translate(-8px,5px);}
    40%{transform:translate(8px,-5px);}
    60%{transform:translate(-5px,-4px);}
    80%{transform:translate(5px,4px);}
    100%{transform:translate(0,0);}
}

</style>
</head>

<body>

<div id="stars"></div>

<div id="screen">

    <div id="content">

        <div class="tap">
            Ekrana tıkla ❤️
        </div>

    </div>

</div>

<!-- ROKET -->

<div id="rocket">

    <div class="wing left"></div>
    <div class="wing right"></div>

    <div class="rocket-body">

        <div class="nose"></div>

        <div class="window"></div>

        <div class="stripe"></div>

    </div>

    <div class="engine"></div>

</div>

<!-- ALEV -->

<div id="flame">

    <div class="flame-outer"></div>
    <div class="flame-inner"></div>

</div>

<!-- PATLAMA -->

<div id="explosionFlash"></div>

<!-- KALPLER -->

<div id="heartParticles"></div>

<div id="bigHeart"></div>

<div id="innerHeart">
    ❤️
</div>


<script>

/* =========================
   ELEMENTLER
========================= */

const screen =
    document.getElementById("screen");

const content =
    document.getElementById("content");

const rocket =
    document.getElementById("rocket");

const flame =
    document.getElementById("flame");

const explosionFlash =
    document.getElementById("explosionFlash");

const heartParticles =
    document.getElementById("heartParticles");

const bigHeart =
    document.getElementById("bigHeart");

const innerHeart =
    document.getElementById("innerHeart");


let step = 0;
let finished = false;


/* =========================
   YILDIZLAR
========================= */

for(let i=0;i<120;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.setProperty(
        "--t",
        (1.5+Math.random()*3)+"s"
    );

    star.style.opacity =
        .2+Math.random()*.8;

    document
        .getElementById("stars")
        .appendChild(star);
}


/* =========================
   MESAJLAR
========================= */

const messages=[

    "Tıkla Fatih... ❤️",

    "Sana bir şey söyleyeceğim...",

    "İyi ki...",

    "İyi ki seni tanımışım... 🥹",

    "Seni çok seviyorum...",

    "Pampimmmmmmm ❤️"

];


/* =========================
   TIKLAMA
========================= */

screen.addEventListener(
    "click",
    ()=>{

        if(finished)
            return;


        /* PAMPİM */

        if(step === 5){

            content.innerHTML=`

                <div id="pampimArea">

                    <div class="message">
                        Pampimmmmmmm ❤️
                    </div>

                    <div id="countdown">
                        7
                    </div>

                </div>

            `;

            step++;

            startCountdown();

            return;
        }


        content.innerHTML=`

            <div class="message">
                ${messages[step]}
            </div>

        `;

        step++;

    }
);


/* =========================
   GERİ SAYIM
========================= */

function startCountdown(){

    let number=7;


    const timer =
        setInterval(
            ()=>{

                number--;


                if(number>0){

                    const count =
                        document.getElementById(
                            "countdown"
                        );

                    if(count){

                        count.textContent=
                            number;

                        count.style.animation=
                            "none";

                        void count.offsetWidth;

                        count.style.animation=
                            "numberIn .65s ease";
                    }

                }
                else{

                    clearInterval(timer);

                    content.innerHTML="";

                    launchRocket();
                }

            },
            1000
        );
}


/* =========================
   ROKET FIRLAT
========================= */

function launchRocket(){

    finished=true;

    rocket.classList.add("fly");

    flame.classList.add("show");


    /*
       Roketle alev aynı hızda yukarı gider.
       Böylece alev altta kalmaz.
    */

    rocket.addEventListener(
        "animationend",
        rocketArrived,
        {once:true}
    );
}


/* =========================
   ROKET ULAŞTI
========================= */

function rocketArrived(){

    /*
       Önce roketi gizle.
       Artık ekranda kalmayacak.
    */

    rocket.style.display="none";
    flame.style.display="none";

    rocket.classList.remove("fly");
    flame.classList.remove("show");


    /*
       Patlama.
    */

    explosion();
}


/* =========================
   PATLAMA
========================= */

function explosion(){

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        350
    );


    explosionFlash.classList.remove(
        "active"
    );

    void explosionFlash.offsetWidth;

    explosionFlash.classList.add(
        "active"
    );


    /*
       Ateş parçaları
    */

    for(let i=0;i<75;i++){

        createExplosionParticle();

    }


    /*
       Çok kısa süre sonra kalp başlıyor.
       Uzun bekleme yok.
    */

    setTimeout(
        createHeart,
        500
    );
}


/* =========================
   PATLAMA PARÇASI
========================= */

function createExplosionParticle(){

    const p =
        document.createElement("div");

    p.className=
        "explosionParticle";


    const angle=
        Math.random()*Math.PI*2;

    const distance=
        100+Math.random()*330;


    p.style.setProperty(
        "--x",
        Math.cos(angle)*distance+"px"
    );

    p.style.setProperty(
        "--y",
        Math.sin(angle)*distance+"px"
    );

    p.style.setProperty(
        "--size",
        (4+Math.random()*12)+"px"
    );


    const colors=[
        "#ffffff",
        "#fff700",
        "#ffbd00",
        "#ff6200",
        "#ff1900"
    ];

    p.style.background=
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];


    document.body.appendChild(p);


    setTimeout(
        ()=>{
            p.remove();
        },
        1200
    );
}


/* =========================
   KALP FORMÜLÜ
========================= */

function heartPoint(t){

    return {

        x:
            16 *
            Math.pow(
                Math.sin(t),
                3
            ),

        y:
            -(
                13*Math.cos(t)
                -
                5*Math.cos(2*t)
                -
                2*Math.cos(3*t)
                -
                Math.cos(4*t)
            )

    };

}


/* =========================
   KALP OLUŞTUR
========================= */

function createHeart(){

    /*
       Kalbin dış çizgisi
    */

    for(let i=0;i<180;i++){

        const t=
            Math.PI*2*i/180;

        const point=
            heartPoint(t);


        createHeartParticle(
            point.x*12,
            point.y*12
        );
    }


    /*
       Kalbin içini doldur
    */

    for(let i=0;i<280;i++){

        const t=
            Math.random()*Math.PI*2;

        const point=
            heartPoint(t);

        const scale=
            .15+
            Math.random()*.8;


        createHeartParticle(
            point.x*12*scale,
            point.y*12*scale
        );
    }


    /*
       Silik büyük kalp.
    */

    setTimeout(
        ()=>{
            bigHeart.classList.add("show");
        },
        450
    );


    /*
       Büyük kalbin ilk atışı.
    */

    setTimeout(
        ()=>{
            beatBigHeart();

            setTimeout(
                beatBigHeart,
                650
            );

        },
        1500
    );


    /*
       İKİNCİ KALP.

       Bu kez gerçekten ana kalbin
       tam merkezinden çıkıyor.
    */

    setTimeout(
        ()=>{
            innerHeart.classList.add("show");

            createRing();

        },
        2450
    );


    /*
       İç kalbin atışı.
    */

    setTimeout(
        ()=>{
            beatInnerHeart();

            setTimeout(
                beatInnerHeart,
                750
            );

        },
        4200
    );


    /*
       Final.
    */

    setTimeout(
        showFinal,
        5400
    );
}


/* =========================
   KALP PARÇASI
========================= */

function createHeartParticle(x,y){

    const heart =
        document.createElement("div");

    heart.className=
        "heartParticle";


    const symbols=[
        "❤️",
        "💗",
        "💖",
        "💕"
    ];


    heart.textContent=
        symbols[
            Math.floor(
                Math.random()*symbols.length
            )
        ];


    heart.style.setProperty(
        "--x",
        x+"px"
    );

    heart.style.setProperty(
        "--y",
        y+"px"
    );

    heart.style.setProperty(
        "--size",
        (8+Math.random()*12)+"px"
    );


    heartParticles.appendChild(
        heart
    );


    setTimeout(
        ()=>{
            heart.remove();
        },
        3000
    );
}


/* =========================
   BÜYÜK KALP ATIŞI
========================= */

function beatBigHeart(){

    bigHeart.classList.remove("beat");

    void bigHeart.offsetWidth;

    bigHeart.classList.add("beat");

    createRing();
}


/* =========================
   İÇ KALP ATIŞI
========================= */

function beatInnerHeart(){

    innerHeart.classList.remove("beat");

    void innerHeart.offsetWidth;

    innerHeart.classList.add("beat");

    createRing();
}


/* =========================
   HALKA
========================= */

function createRing(){

    const ring=
        document.createElement("div");

    ring.className="ring";

    document.body.appendChild(ring);

    setTimeout(
        ()=>{
            ring.remove();
        },
        1000
    );
}


/* =========================
   FİNAL YAZISI
========================= */

function showFinal(){

    const final=
        document.createElement("div");

    final.id="finalText";

    final.innerHTML=`

        <div class="finalMain">
            Seni çok seviyorum Fatih ❤️
        </div>

        <div class="finalSub">
            Pampimmmmmmm 🥹❤️
        </div>

    `;

    document.body.appendChild(final);
}

</script>
