<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    radial-gradient(circle at 50% 100%, #250038 0%, #090012 55%, #020006 100%);
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
}

#content {
  position: relative;
  z-index: 20;
  padding: 25px;
}

.message {
  font-size: clamp(30px, 8vw, 58px);
  font-weight: bold;
  line-height: 1.3;
  animation: appear .8s ease;
  text-shadow:
    0 0 10px #ff4fa3,
    0 0 25px #ff4fa3;
}

.tap {
  font-size: 22px;
  animation: blink 1.2s infinite;
  color: #ffd6ec;
}

#countdown {
  font-size: clamp(100px, 30vw, 180px);
  font-weight: bold;
  color: #ff4fa3;
  text-shadow:
    0 0 15px #ff4fa3,
    0 0 40px #ff1493,
    0 0 80px #ff1493;
  animation: countdownAnim .9s ease;
}

/* Roket */
#rocket {
  position: fixed;
  left: 50%;
  bottom: -100px;
  transform: translateX(-50%);
  font-size: 55px;
  z-index: 30;
  display: none;
}

.rocket-fly {
  display: block !important;
  animation: rocketFly 2.3s cubic-bezier(.4,0,.2,1) forwards;
}

@keyframes rocketFly {
  0% {
    bottom: -100px;
  }

  100% {
    bottom: 65%;
  }
}

/* Roket ateşi */
.flame {
  position: fixed;
  width: 12px;
  height: 35px;
  border-radius: 50%;
  background: linear-gradient(#fff,#ffcc00,#ff4500);
  box-shadow: 0 0 15px #ff6600;
  display: none;
  z-index: 29;
}

.flame.show {
  display: block;
  animation: flameMove .12s infinite alternate;
}

@keyframes flameMove {
  from {
    transform: scaleY(1);
  }

  to {
    transform: scaleY(.65);
  }
}

/* Patlama alanı */
#explosion {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 15;
}

/* Kalp parçacıkları */
.particle {
  position: fixed;
  font-size: 22px;
  pointer-events: none;
  opacity: 0;
  animation: particleFly 2.2s ease-out forwards;
}

/* Son büyük kalp */
#bigHeart {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: clamp(150px, 55vw, 330px);
  z-index: 40;
  opacity: 0;
  filter:
    drop-shadow(0 0 15px #ff1493)
    drop-shadow(0 0 45px #ff1493)
    drop-shadow(0 0 80px #ff1493);
}

.big-heart-show {
  animation: bigHeartAppear 2s ease forwards;
}

@keyframes bigHeartAppear {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }

  45% {
    transform: translate(-50%, -50%) scale(1.25);
    opacity: 1;
  }

  65% {
    transform: translate(-50%, -50%) scale(.9);
  }

  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

@keyframes particleFly {
  0% {
    transform:
      translate(-50%, -50%)
      scale(.2);
    opacity: 1;
  }

  100% {
    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1.2);
    opacity: 0;
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes blink {
  0%,100% {
    opacity: .35;
  }

  50% {
    opacity: 1;
  }
}

@keyframes countdownAnim {
  from {
    transform: scale(1.8);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}
</style>
</head>

<body>

<div id="screen">
  <div id="content">
    <div class="tap">Ekrana tıkla ❤️</div>
  </div>
</div>

<div id="rocket">🚀</div>
<div class="flame" id="flame"></div>

<div id="explosion"></div>

<div id="bigHeart">❤️</div>

<script>

const screen = document.getElementById("screen");
const content = document.getElementById("content");
const rocket = document.getElementById("rocket");
const flame = document.getElementById("flame");
const explosion = document.getElementById("explosion");
const bigHeart = document.getElementById("bigHeart");

let step = 0;
let finished = false;

const messages = [
  "Tıkla Fatih... ❤️",
  "Sana bir şey söyleyeceğim...",
  "İyi ki...",
  "İyi ki seni tanımışım... 🥹",
  "Seni çok seviyorum...",
  "Pampimmmmmmm ❤️"
];

screen.addEventListener("click", function() {

  if (finished) return;

  if (step < messages.length) {

    content.innerHTML = `
      <div class="message">
        ${messages[step]}
      </div>
    `;

    step++;

    /*
      Son yazı geldiğinde:
      7 saniye bekle
      sonra geri sayım başla
    */
    if (step === messages.length) {

      setTimeout(() => {
        startCountdown();
      }, 7000);
    }
  }
});


function startCountdown() {

  let number = 7;

  content.innerHTML = `
    <div id="countdown">7</div>
  `;

  const counter = setInterval(() => {

    number--;

    if (number > 0) {

      content.innerHTML = `
        <div id="countdown">${number}</div>
      `;

    } else {

      clearInterval(counter);

      content.innerHTML = "";

      launchRocket();
    }

  }, 1000);
}


/*
  TEK ROKET FIRLAT
*/
function launchRocket() {

  finished = true;

  rocket.classList.add("rocket-fly");
  flame.classList.add("show");

  // Roket ekranın üst kısmına geldiğinde patlat
  setTimeout(() => {

    rocket.style.display = "none";
    flame.style.display = "none";

    heartExplosion();

  }, 2200);
}


/*
  KALP ŞEKLİNDE PATLAMA
*/
function heartExplosion() {

  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight * .35;

  const heartSymbols = [
    "❤️",
    "💖",
    "💕",
    "💗",
    "💓",
    "💘"
  ];

  /*
    Matematiksel kalp eğrisi:
    Bu sayede parçacıklar gerçekten kalp
    şeklinde diziliyor.
  */

  for (let i = 0; i < 100; i++) {

    const t = Math.PI * 2 * (i / 100);

    const x =
      16 * Math.pow(Math.sin(t), 3);

    const y =
      -(13 * Math.cos(t)
      - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t)
      - Math.cos(4*t));

    const scale = 13;

    createParticle(
      centerX,
      centerY,
      x * scale,
      y * scale
    );
  }

  /*
    Patlamadan biraz sonra
    ortada büyük kalp göster
  */

  setTimeout(() => {

    bigHeart.classList.add("big-heart-show");

    content.innerHTML = `
      <div class="message">
        Seni çok seviyorum Fatih ❤️
      </div>
    `;

    content.style.position = "fixed";
    content.style.left = "50%";
    content.style.top = "78%";
    content.style.transform = "translateX(-50%)";

  }, 900);
}


function createParticle(startX, startY, x, y) {

  const particle = document.createElement("div");

  particle.className = "particle";

  const symbols = [
    "❤️",
    "💖",
    "💕",
    "💗",
    "💓"
  ];

  particle.innerHTML =
    symbols[Math.floor(Math.random() * symbols.length)];

  particle.style.left = startX + "px";
  particle.style.top = startY + "px";

  particle.style.setProperty(
    "--x",
    x + "px"
  );

  particle.style.setProperty(
    "--y",
    y + "px"
  );

  explosion.appendChild(particle);

  setTimeout(() => {
    particle.remove();
  }, 2300);
}

</script>

</body>
</html>
