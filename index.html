<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 100%,#3b0058 0%,#11001c 48%,#020005 100%);
    color:white;
    font-family:Arial,sans-serif;
}

#screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

#content{
    position:relative;
    z-index:20;
    width:100%;
    padding:20px;
}

.message{
    font-size:clamp(28px,8vw,58px);
    font-weight:bold;
    line-height:1.25;
    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff1493,
        0 0 50px #ff1493;
    animation:textIn .65s ease forwards;
}

.tap{
    font-size:22px;
    color:#ffd6ec;
    animation:blink 1.2s infinite;
}

#pampimArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}

#countdown{
    font-size:clamp(75px,20vw,130px);
    font-weight:bold;
    color:#ff4fa3;
    text-shadow:
        0 0 12px #ff4fa3,
        0 0 35px #ff1493;
    animation:countIn .5s ease;
}

/* =========================
   CANVAS
========================= */

#fx{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:10;
}

/* =========================
   ROKET
========================= */

#rocket{
    position:fixed;
    left:50%;
    bottom:-190px;
    width:82px;
    height:175px;
    transform:translateX(-50%);
    z-index:30;
    display:none;
    will-change:transform,bottom;
}

#rocket.active{
    display:block;
    animation:rocketFly 2.35s cubic-bezier(.2,.75,.2,1) forwards;
}

.rocket-body{
    position:absolute;
    left:50%;
    bottom:28px;
    width:52px;
    height:118px;
    transform:translateX(-50%);
    border-radius:50% 50% 16% 16%;
    background:linear-gradient(
        90deg,
        #555 0%,
        #ddd 20%,
        #fff 50%,
        #ccc 72%,
        #555 100%
    );
    box-shadow:
        inset 5px 0 8px rgba(255,255,255,.7),
        inset -6px 0 9px rgba(0,0,0,.45);
}

.rocket-nose{
    position:absolute;
    left:0;
    top:-29px;
    width:52px;
    height:44px;
    background:linear-gradient(90deg,#666,#fff,#aaa);
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.rocket-window{
    position:absolute;
    top:27px;
    left:50%;
    width:25px;
    height:25px;
    transform:translateX(-50%);
    border-radius:50%;
    border:4px solid #555;
    background:radial-gradient(
        circle at 35% 30%,
        white,
        #5de0ff 35%,
        #07559e 100%
    );
    box-shadow:0 0 10px #4fd6ff;
}

.rocket-line{
    position:absolute;
    top:67px;
    left:0;
    width:100%;
    height:6px;
    background:#ff164d;
}

.rocket-wing{
    position:absolute;
    bottom:28px;
    width:30px;
    height:62px;
    background:linear-gradient(135deg,#ff315f,#81002d);
    z-index:-1;
}

.rocket-wing.left{
    left:2px;
    transform:translateX(-21px);
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.rocket-wing.right{
    right:2px;
    transform:translateX(21px);
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.rocket-engine{
    position:absolute;
    left:50%;
    bottom:12px;
    width:28px;
    height:24px;
    transform:translateX(-50%);
    background:#222;
    border-radius:0 0 12px 12px;
}

/* =========================
   ALEV
========================= */

#flame{
    position:fixed;
    left:50%;
    bottom:-50px;
    width:42px;
    height:105px;
    transform:translateX(-50%);
    display:none;
    z-index:25;
    pointer-events:none;
}

#flame.active{
    display:block;
    animation:flameShake .09s infinite alternate;
}

.flame-core{
    position:absolute;
    left:50%;
    width:27px;
    height:100px;
    transform:translateX(-50%);
    border-radius:50% 50% 70% 70%;
    background:linear-gradient(
        to bottom,
        white 0%,
        #fff700 20%,
        #ff8c00 55%,
        #ff1e00 100%
    );
    filter:
        blur(2px)
        drop-shadow(0 0 12px #ff7b00)
        drop-shadow(0 0 28px #ff2600);
}

/* =========================
   PATLAMA FLASH
========================= */

#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:80;
}

#flash.active{
    animation:flash .42s ease-out forwards;
}

/* =========================
   KALP
========================= */

#heartContainer{
    position:fixed;
    left:50%;
    top:43%;
    width:min(82vw,390px);
    height:min(82vw,390px);
    transform:translate(-50%,-50%);
    z-index:50;
    pointer-events:none;
    opacity:0;
}

#heartContainer.show{
    animation:heartAppear 1.2s ease forwards;
}

.heartShape{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.heartShape::before{
    content:"❤";
    font-size:min(75vw,330px);
    color:#ff1493;
    opacity:.16;
    filter:
        drop-shadow(0 0 18px #ff1493)
        drop-shadow(0 0 45px #ff1493);
}

/* İçteki gerçek kalp */

#innerHeart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    font-size:clamp(65px,19vw,115px);
    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 20px #ff1493)
        drop-shadow(0 0 45px #ff1493);
    opacity:0;
}

#innerHeart.show{
    animation:innerBirth 1.25s cubic-bezier(.2,.8,.2,1) forwards;
}

/* Kalp atışı */

#innerHeart.pulse{
    animation:heartPulse .65s ease;
}

/* Yazı ilk kalbin altında */

#finalText{
    position:fixed;
    left:50%;
    top:70%;
    width:92%;
    transform:translateX(-50%);
    z-index:100;
    text-align:center;
    opacity:0;
    pointer-events:none;
}

#finalText.show{
    animation:finalIn 1s ease forwards;
}

.final-main{
    font-size:clamp(24px,6vw,48px);
    font-weight:bold;
    color:white;
    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff1493,
        0 0 50px #ff1493;
}

.final-pampim{
    margin-top:9px;
    font-size:clamp(20px,5vw,32px);
    color:#ffb6da;
    font-weight:bold;
}

/* =========================
   ANİMASYONLAR
========================= */

@keyframes textIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.85);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes blink{
    0%,100%{opacity:.35}
    50%{opacity:1}
}

@keyframes countIn{
    from{
        opacity:0;
        transform:scale(1.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes rocketFly{
    0%{
        bottom:-190px;
        transform:translateX(-50%) rotate(-3deg);
    }
    25%{
        transform:translateX(-50%) rotate(2deg);
    }
    50%{
        transform:translateX(-50%) rotate(-2deg);
    }
    75%{
        transform:translateX(-50%) rotate(1deg);
    }
    100%{
        bottom:56%;
        transform:translateX(-50%) rotate(0);
    }
}

@keyframes flameShake{
    from{
        transform:translateX(-50%) scaleY(1);
    }
    to{
        transform:translateX(-50%) scaleY(.65);
    }
}

@keyframes flash{
    0%{opacity:0}
    15%{opacity:.95}
    100%{opacity:0}
}

@keyframes heartAppear{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }
    55%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.08);
    }
    75%{
        transform:translate(-50%,-50%) scale(.96);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes innerBirth{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }
    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.8);
    }
    55%{
        transform:translate(-50%,-50%) scale(1.18);
    }
    72%{
        transform:translate(-50%,-50%) scale(.92);
    }
    88%{
        transform:translate(-50%,-50%) scale(1.06);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes heartPulse{
    0%{
        transform:translate(-50%,-50%) scale(1);
    }
    22%{
        transform:translate(-50%,-50%) scale(1.18);
    }
    42%{
        transform:translate(-50%,-50%) scale(.94);
    }
    62%{
        transform:translate(-50%,-50%) scale(1.1);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes finalIn{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(20px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

body.shake{
    animation:screenShake .35s ease;
}

@keyframes screenShake{
    0%,100%{transform:translate(0)}
    20%{transform:translate(-7px,4px)}
    40%{transform:translate(6px,-4px)}
    60%{transform:translate(-4px,3px)}
    80%{transform:translate(4px,-2px)}
}
</style>
</head>

<body>

<div id="screen">
    <div id="content">
        <div class="tap">Ekrana tıkla ❤️</div>
    </div>
</div>

<!-- Roket -->
<div id="rocket">

    <div class="rocket-wing left"></div>
    <div class="rocket-wing right"></div>

    <div class="rocket-body">

        <div class="rocket-nose"></div>

        <div class="rocket-window"></div>

        <div class="rocket-line"></div>

    </div>

    <div class="rocket-engine"></div>

</div>

<div id="flame">
    <div class="flame-core"></div>
</div>

<!-- Tek canvas: performans için -->
<canvas id="fx"></canvas>

<div id="flash"></div>

<!-- Kalp -->
<div id="heartContainer">
    <div class="heartShape"></div>

    <div id="innerHeart">
        ❤️
    </div>
</div>

<div id="finalText">
    <div class="final-main">
        Seni çok seviyorum Fatih ❤️
    </div>

    <div class="final-pampim">
        Pampimmmmmmm 🥹❤️
    </div>
</div>

<script>
/* =====================================================
   ELEMENTLER
===================================================== */

const screen = document.getElementById("screen");
const content = document.getElementById("content");
const rocket = document.getElementById("rocket");
const flame = document.getElementById("flame");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const flash = document.getElementById("flash");
const heartContainer = document.getElementById("heartContainer");
const innerHeart = document.getElementById("innerHeart");
const finalText = document.getElementById("finalText");

let step = 0;
let finished = false;
let countdownStarted = false;

/* =====================================================
   CANVAS
===================================================== */

let W = 0;
let H = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 1.5);

function resizeCanvas(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);

/* =====================================================
   MESAJLAR
===================================================== */

const messages = [
    "Tıkla Fatih... ❤️",
    "Sana bir şey söyleyeceğim...",
    "İyi ki...",
    "İyi ki seni tanımışım... 🥹",
    "Seni çok seviyorum..."
];

/* =====================================================
   TIKLAMALAR
===================================================== */

screen.addEventListener("click",function(){

    if(finished) return;

    /* Sonraki adımlar normal */

    if(step < messages.length){

        content.innerHTML = `
            <div class="message">
                ${messages[step]}
            </div>
        `;

        step++;

        return;
    }

    /*
       PAMPİM'E GEÇİNCE
       OTOMATİK SAYIM BAŞLAR
    */

    if(!countdownStarted){

        countdownStarted = true;

        content.innerHTML = `
            <div id="pampimArea">

                <div class="message">
                    Pampimmmmmmm ❤️
                </div>

                <div id="countdown">
                    7
                </div>

            </div>
        `;

        startCountdown();
    }

});

/* =====================================================
   GERİ SAYIM
===================================================== */

function startCountdown(){

    let number = 7;

    const timer = setInterval(function(){

        number--;

        const counter = document.getElementById("countdown");

        if(number > 0 && counter){

            counter.textContent = number;

            counter.style.animation = "none";

            void counter.offsetWidth;

            counter.style.animation = "countIn .5s ease";
        }

        if(number <= 0){

            clearInterval(timer);

            content.innerHTML = "";

            launchRocket();
        }

    },1000);
}

/* =====================================================
   ROKET
===================================================== */

function launchRocket(){

    finished = true;

    rocket.style.display = "block";

    rocket.classList.add("active");

    flame.classList.add("active");

    /*
       Roket hareket ederken arkasında
       hafif duman bırak
    */

    let smokeTimer = setInterval(function(){

        createSmoke();

    },80);

    /*
       2.35 saniye sonra roketi
       GERÇEKTEN DOM'DAN görünmez yap.
    */

    setTimeout(function(){

        clearInterval(smokeTimer);

        rocket.classList.remove("active");
        rocket.style.display = "none";

        flame.classList.remove("active");
        flame.style.display = "none";

        rocketExplosion();

    },2350);
}

/* =====================================================
   DUMAN
===================================================== */

function createSmoke(){

    const rect = rocket.getBoundingClientRect();

    if(rect.width === 0) return;

    const x = rect.left + rect.width / 2;
    const y = rect.bottom - 5;

    smokeParticles.push({
        x:x,
        y:y,
        vx:(Math.random()-.5)*.7,
        vy:.5 + Math.random(),
        life:1,
        size:5 + Math.random()*7
    });

    /*
       Çok fazla birikmesini önlüyoruz.
    */

    if(smokeParticles.length > 45){
        smokeParticles.shift();
    }
}

/* =====================================================
   PARÇACIK SİSTEMİ
===================================================== */

const sparks = [];
const fireballs = [];
const smokeParticles = [];
const heartParticles = [];
const stars = [];

function random(min,max){
    return Math.random()*(max-min)+min;
}

/* =====================================================
   ROKET PATLAMASI
===================================================== */

function rocketExplosion(){

    const x = W/2;
    const y = H*.44;

    /*
       Ekran flash
    */

    flash.classList.remove("active");
    void flash.offsetWidth;
    flash.classList.add("active");

    /*
       Hafif ekran sarsıntısı
    */

    document.body.classList.add("shake");

    setTimeout(function(){
        document.body.classList.remove("shake");
    },350);

    /*
       Ateş topları
    */

    for(let i=0;i<28;i++){

        const angle = random(0,Math.PI*2);
        const speed = random(2,7);

        fireballs.push({
            x:x,
            y:y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:1,
            size:random(4,9)
        });
    }

    /*
       Kıvılcımlar
    */

    for(let i=0;i<70;i++){

        const angle = random(0,Math.PI*2);
        const speed = random(2,10);

        sparks.push({
            x:x,
            y:y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:1,
            size:random(1,3)
        });
    }

    /*
       Patlamadan hemen sonra kalp
       gecikme yok denecek kadar az.
    */

    setTimeout(function(){

        createHeartExplosion();

    },320);
}

/* =====================================================
   KALP OLUŞUMU
===================================================== */

function createHeartExplosion(){

    heartContainer.style.display = "block";
    heartContainer.classList.remove("show");

    void heartContainer.offsetWidth;

    heartContainer.classList.add("show");

    /*
       Matematiksel kalp noktaları
    */

    const centerX = W/2;
    const centerY = H*.43;

    for(let i=0;i<120;i++){

        const t = Math.PI*2*(i/120);

        const x =
            16*Math.pow(Math.sin(t),3);

        const y =
            -(13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t));

        heartParticles.push({

            x:centerX,
            y:centerY,

            tx:centerX+x*10.5,
            ty:centerY+y*10.5,

            progress:0,
            size:random(2.5,5),
            color:Math.random()>.5
                ? "#ff4fa3"
                : "#ff1493"
        });
    }

    /*
       İç kalp.
    */

    setTimeout(function(){

        innerHeart.classList.remove("show");

        void innerHeart.offsetWidth;

        innerHeart.classList.add("show");

    },650);

    /*
       İlk kalp atışı.
    */

    setTimeout(function(){

        pulseHeart();

    },1900);

    /*
       İkinci atış.
    */

    setTimeout(function(){

        pulseHeart();

    },2750);

    /*
       Yazı ilk kalbin altında.
    */

    setTimeout(function(){

        finalText.classList.add("show");

    },2050);

    /*
       Yıldızları başlat.
    */

    createStars();
}

/* =====================================================
   KALP ATIŞI
===================================================== */

function pulseHeart(){

    innerHeart.classList.remove("pulse");

    void innerHeart.offsetWidth;

    innerHeart.classList.add("pulse");

    /*
       Atış sırasında birkaç yıldız.
    */

    for(let i=0;i<10;i++){

        const angle = random(0,Math.PI*2);

        stars.push({
            x:W/2,
            y:H*.43,
            vx:Math.cos(angle)*random(1,3),
            vy:Math.sin(angle)*random(1,3),
            life:1,
            size:random(1,2.5)
        });
    }
}

/* =====================================================
   YILDIZLAR
===================================================== */

function createStars(){

    for(let i=0;i<45;i++){

        stars.push({

            x:random(0,W),

            y:random(0,H),

            vx:random(-.15,.15),

            vy:random(-.3,.3),

            life:1,

            size:random(1,2.5),

            twinkle:random(0,Math.PI*2)

        });
    }
}

/* =====================================================
   ANİMASYON DÖNGÜSÜ
===================================================== */

function animate(){

    ctx.clearRect(0,0,W,H);

    /* Duman */

    for(let i=smokeParticles.length-1;i>=0;i--){

        const p = smokeParticles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life -= .025;
        p.size += .08;

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(180,180,190,${p.life*.28})`;

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(p.life<=0){

            smokeParticles.splice(i,1);
        }
    }

    /* Ateş topları */

    for(let i=fireballs.length-1;i>=0;i--){

        const p = fireballs[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .985;
        p.vy *= .985;

        p.vy += .035;

        p.life -= .025;

        const gradient =
            ctx.createRadialGradient(
                p.x,p.y,0,
                p.x,p.y,p.size*4
            );

        gradient.addColorStop(0,"white");
        gradient.addColorStop(.25,"#fff700");
        gradient.addColorStop(.55,"#ff7200");
        gradient.addColorStop(1,"transparent");

        ctx.fillStyle = gradient;

        ctx.globalAlpha = Math.max(p.life,0);

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size*3,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha = 1;

        if(p.life<=0){

            fireballs.splice(i,1);
        }
    }

    /* Kıvılcımlar */

    for(let i=sparks.length-1;i>=0;i--){

        const p = sparks[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .97;
        p.vy *= .97;

        p.vy += .08;

        p.life -= .018;

        ctx.globalAlpha =
            Math.max(p.life,0);

        ctx.fillStyle =
            Math.random()>.5
            ? "#fff"
            : "#ff9d00";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha = 1;

        if(p.life<=0){

            sparks.splice(i,1);
        }
    }

    /* Kalp parçacıkları */

    for(let i=heartParticles.length-1;i>=0;i--){

        const p = heartParticles[i];

        p.progress += .035;

        const ease =
            1-Math.pow(1-p.progress,3);

        const x =
            p.x +
            (p.tx-p.x)*ease;

        const y =
            p.y +
            (p.ty-p.y)*ease;

        ctx.globalAlpha =
            Math.min(p.progress*3,1);

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff1493";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.globalAlpha = 1;

        if(p.progress>=1){

            heartParticles.splice(i,1);
        }
    }

    /* Yıldızlar */

    for(let i=stars.length-1;i>=0;i--){

        const p = stars[i];

        p.x += p.vx;
        p.y += p.vy;

        p.twinkle =
            (p.twinkle || 0)+.05;

        p.life -= .002;

        const alpha =
            .25 +
            Math.abs(Math.sin(p.twinkle))*.65;

        ctx.globalAlpha =
            Math.max(0,Math.min(1,alpha*p.life));

        ctx.fillStyle = "#fff";

        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ffb7e0";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.globalAlpha = 1;

        if(
            p.life<=0 ||
            p.x<0 ||
            p.x>W ||
            p.y<0 ||
            p.y>H
        ){

            stars.splice(i,1);
        }
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
