<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            ellipse at 50% 100%,
            #43005c 0%,
            #190022 38%,
            #07000d 72%,
            #010004 100%
        );
    color:white;
    font-family:Arial,sans-serif;
}


/* =========================================================
   YILDIZLI ARKA PLAN
========================================================= */

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 5px white;
    animation:twinkle var(--time) ease-in-out infinite;
    opacity:var(--opacity);
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =========================================================
   ANA EKRAN
========================================================= */

#screen{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    cursor:pointer;

    z-index:10;
}

#content{
    position:relative;
    z-index:20;

    width:100%;
    padding:25px;
}

.message{
    font-size:clamp(29px,8vw,58px);
    font-weight:bold;
    line-height:1.3;

    color:white;

    text-shadow:
        0 0 8px #ff70ba,
        0 0 20px #ff2d93,
        0 0 45px #ff1493;

    animation:messageIn .8s cubic-bezier(.2,.8,.2,1);
}

.tap{
    font-size:22px;
    color:#ffd6ec;

    text-shadow:
        0 0 10px #ff1493;

    animation:
        tapPulse
        1.4s
        ease-in-out
        infinite;
}

@keyframes messageIn{
    0%{
        opacity:0;
        transform:scale(.45) translateY(20px);
        filter:blur(8px);
    }

    60%{
        transform:scale(1.06);
    }

    100%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes tapPulse{
    0%,100%{
        opacity:.35;
        transform:scale(.96);
    }

    50%{
        opacity:1;
        transform:scale(1.04);
    }
}


/* =========================================================
   PAMPİM + SAYIM
========================================================= */

#pampimBox{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

#countdown{
    font-size:clamp(80px,23vw,155px);
    font-weight:900;

    color:#ff4da6;

    line-height:1;

    text-shadow:
        0 0 10px #ff70bd,
        0 0 30px #ff1493,
        0 0 70px #ff1493;

    animation:countIn .7s ease;
}

@keyframes countIn{
    0%{
        opacity:0;
        transform:scale(1.8);
        filter:blur(8px);
    }

    70%{
        transform:scale(.92);
    }

    100%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}


/* =========================================================
   ROKET
========================================================= */

#rocket{
    position:fixed;

    left:50%;
    bottom:-230px;

    width:100px;
    height:210px;

    transform:translateX(-50%);

    display:none;

    z-index:50;
}

.rocketActive{
    display:block!important;

    animation:
        rocketFlight
        3.2s
        cubic-bezier(.18,.72,.15,1)
        forwards;
}

.rocketBody{
    position:absolute;

    left:50%;
    bottom:42px;

    width:58px;
    height:135px;

    transform:translateX(-50%);

    border-radius:
        50%
        50%
        20%
        20%;

    background:
        linear-gradient(
            90deg,
            #4b4b54 0%,
            #cfd2dc 18%,
            #ffffff 48%,
            #bfc2cc 76%,
            #414149 100%
        );

    box-shadow:
        inset 5px 0 10px rgba(255,255,255,.7),
        inset -6px 0 12px rgba(0,0,0,.5),
        0 0 10px rgba(255,255,255,.15);
}

.rocketNose{
    position:absolute;

    top:-35px;
    left:0;

    width:58px;
    height:50px;

    background:
        linear-gradient(
            90deg,
            #666,
            #fff 48%,
            #aaa
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.rocketWindow{
    position:absolute;

    top:30px;
    left:50%;

    width:27px;
    height:27px;

    transform:translateX(-50%);

    border:4px solid #555;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #5ee5ff 30%,
            #0766aa 70%,
            #021b43
        );

    box-shadow:
        0 0 8px #50dfff,
        inset 0 0 6px #fff;
}

.rocketStripe{
    position:absolute;

    top:72px;
    left:0;

    width:100%;
    height:7px;

    background:
        linear-gradient(
            90deg,
            #ff003d,
            #ff4b83,
            #ff003d
        );

    box-shadow:
        0 0 7px #ff174f;
}

.rocketWing{
    position:absolute;

    bottom:42px;

    width:36px;
    height:72px;

    background:
        linear-gradient(
            135deg,
            #ff315f,
            #790024
        );

    z-index:-1;
}

.rocketWing.left{
    left:5px;

    transform:
        translateX(-28px)
        skewY(12deg);

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.rocketWing.right{
    right:5px;

    transform:
        translateX(28px)
        skewY(-12deg);

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.rocketEngine{
    position:absolute;

    bottom:26px;
    left:50%;

    width:32px;
    height:25px;

    transform:translateX(-50%);

    border-radius:
        0 0 12px 12px;

    background:#1e1e25;
}

@keyframes rocketFlight{

    0%{
        bottom:-230px;

        transform:
            translateX(-50%)
            rotate(-4deg);
    }

    15%{
        transform:
            translateX(-50%)
            rotate(4deg);
    }

    30%{
        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    45%{
        transform:
            translateX(-50%)
            rotate(3deg);
    }

    60%{
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    75%{
        transform:
            translateX(-50%)
            rotate(1deg);
    }

    100%{
        bottom:58%;

        transform:
            translateX(-50%)
            rotate(0deg);
    }
}


/* =========================================================
   ROKET ALEVİ
========================================================= */

#flame{
    position:fixed;

    left:50%;
    bottom:-70px;

    width:55px;
    height:130px;

    transform:translateX(-50%);

    display:none;

    z-index:45;
}

.flameActive{
    display:block!important;

    animation:
        flameShake
        .075s
        infinite
        alternate;
}

.flameOuter{
    position:absolute;

    left:50%;
    top:0;

    width:43px;
    height:120px;

    transform:translateX(-50%);

    border-radius:
        50%
        50%
        70%
        70%;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #fff000 20%,
            #ff9d00 48%,
            #ff3500 78%,
            transparent 100%
        );

    filter:
        blur(2px)
        drop-shadow(0 0 12px #ffb000)
        drop-shadow(0 0 30px #ff3500);
}

.flameInner{
    position:absolute;

    left:50%;
    top:3px;

    width:22px;
    height:90px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            white,
            #fff9a0 35%,
            #ff8a00 100%
        );

    filter:blur(1px);
}

@keyframes flameShake{
    from{
        transform:
            translateX(-50%)
            scaleY(1);
    }

    to{
        transform:
            translateX(-50%)
            scaleY(.72)
            scaleX(1.12);
    }
}


/* =========================================================
   DUMAN
========================================================= */

.smoke{
    position:fixed;

    width:15px;
    height:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(220,220,230,.55),
            rgba(130,130,150,.15),
            transparent
        );

    filter:blur(4px);

    z-index:20;

    pointer-events:none;

    animation:
        smokeUp
        1.1s
        ease-out
        forwards;
}

@keyframes smokeUp{
    0%{
        opacity:.65;
        transform:scale(.4);
    }

    100%{
        opacity:0;
        transform:
            translate(
                var(--sx),
                -80px
            )
            scale(3);
    }
}


/* =========================================================
   PATLAMA FLASH
========================================================= */

#flash{
    position:fixed;

    left:50%;
    top:42%;

    width:30px;
    height:30px;

    border-radius:50%;

    background:white;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    pointer-events:none;

    z-index:80;
}

.flashActive{
    animation:
        flashBoom
        .65s
        ease-out
        forwards;
}

@keyframes flashBoom{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.1);

        opacity:0;
    }

    10%{
        transform:
            translate(-50%,-50%)
            scale(3);

        opacity:1;

        box-shadow:
            0 0 30px white,
            0 0 70px #fff,
            0 0 120px #ff7b00;
    }

    35%{
        transform:
            translate(-50%,-50%)
            scale(9);

        opacity:.95;

        box-shadow:
            0 0 50px white,
            0 0 110px #ffd000,
            0 0 180px #ff3000;
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(20);

        opacity:0;
    }
}


/* =========================================================
   PATLAMA PARÇACIKLARI
========================================================= */

.explosionParticle{
    position:fixed;

    left:50%;
    top:42%;

    pointer-events:none;

    z-index:82;

    border-radius:50%;

    animation:
        explode
        1.35s
        cubic-bezier(.12,.75,.18,1)
        forwards;
}

@keyframes explode{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:1;
    }

    18%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity:0;
    }
}


/* =========================================================
   KALP SAHNESİ
========================================================= */

#heartScene{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:90;
}


/* =========================================================
   KALP NOKTALARI
========================================================= */

.heartParticle{
    position:fixed;

    left:50%;
    top:42%;

    opacity:0;

    pointer-events:none;

    font-size:var(--size);

    filter:
        drop-shadow(0 0 5px #ff4fa3)
        drop-shadow(0 0 12px #ff1493);

    animation:
        formHeart
        2.2s
        cubic-bezier(.15,.75,.2,1)
        forwards;
}

@keyframes formHeart{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.05);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);

        opacity:.95;
    }
}


/* =========================================================
   BÜYÜK NEON KALP
========================================================= */

#megaHeart{
    position:fixed;

    left:50%;
    top:42%;

    width:min(72vw,360px);
    aspect-ratio:1;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    z-index:100;

    pointer-events:none;
}

#megaHeart::before{
    content:"❤";

    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:
        min(72vw,360px);

    line-height:1;

    color:#ff188f;

    opacity:.13;

    filter:
        drop-shadow(0 0 12px #ff1493)
        drop-shadow(0 0 35px #ff1493)
        drop-shadow(0 0 80px #ff1493);
}

#megaHeart.active{
    animation:
        megaHeartIn
        3s
        cubic-bezier(.16,.8,.2,1)
        forwards;
}

@keyframes megaHeartIn{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.1);

        opacity:0;
    }

    35%{
        transform:
            translate(-50%,-50%)
            scale(1.08);

        opacity:1;
    }

    55%{
        transform:
            translate(-50%,-50%)
            scale(.94);
    }

    72%{
        transform:
            translate(-50%,-50%)
            scale(1.02);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:1;
    }
}


/* =========================================================
   İÇTEN DOĞAN KALP
========================================================= */

#innerHeart{
    position:fixed;

    left:50%;
    top:42%;

    z-index:120;

    font-size:
        clamp(65px,20vw,125px);

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    pointer-events:none;

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 15px #ff4fa3)
        drop-shadow(0 0 35px #ff1493)
        drop-shadow(0 0 70px #ff1493);
}

.innerActive{
    animation:
        innerBirth
        2.2s
        cubic-bezier(.12,.8,.2,1)
        forwards;
}

@keyframes innerBirth{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    22%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.25);
    }

    48%{
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    62%{
        transform:
            translate(-50%,-50%)
            scale(.82);
    }

    76%{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    88%{
        transform:
            translate(-50%,-50%)
            scale(.97);
    }

    100%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================================================
   KALP ATIŞI
========================================================= */

.pulse{
    animation:
        pulseHeart
        .7s
        ease-in-out;
}

@keyframes pulseHeart{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    25%{
        transform:
            translate(-50%,-50%)
            scale(1.22);
    }

    45%{
        transform:
            translate(-50%,-50%)
            scale(.94);
    }

    65%{
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================================================
   KALP HALKASI
========================================================= */

.ring{
    position:fixed;

    left:50%;
    top:42%;

    width:50px;
    height:50px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,70,170,.8);

    box-shadow:
        0 0 15px #ff1493;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:.9;

    z-index:115;

    pointer-events:none;

    animation:
        ringOut
        1.5s
        ease-out
        forwards;
}

@keyframes ringOut{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity:.9;
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(5);

        opacity:0;
    }
}


/* =========================================================
   PARILTI NOKTALARI
========================================================= */

.sparkle{
    position:fixed;

    left:50%;
    top:42%;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 18px #ff4fa3,
        0 0 30px #ff1493;

    z-index:125;

    pointer-events:none;

    animation:
        sparkleFly
        1.4s
        ease-out
        forwards;
}

@keyframes sparkleFly{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity:0;
    }
}


/* =========================================================
   UÇAN KÜÇÜK KALPLER
========================================================= */

.floatingHeart{
    position:fixed;

    bottom:-40px;

    left:var(--left);

    font-size:var(--size);

    opacity:0;

    z-index:110;

    pointer-events:none;

    filter:
        drop-shadow(0 0 6px #ff1493)
        drop-shadow(0 0 12px #ff1493);

    animation:
        floatUp
        var(--duration)
        cubic-bezier(.15,.6,.2,1)
        forwards;
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translate3d(0,0,0)
            scale(.35);
    }

    12%{
        opacity:.95;
    }

    45%{
        transform:
            translate3d(
                var(--drift),
                -50vh,
                0
            )
            scale(1);
    }

    75%{
        transform:
            translate3d(
                var(--drift2),
                -82vh,
                0
            )
            scale(.9);
    }

    100%{
        transform:
            translate3d(
                var(--drift3),
                -118vh,
                0
            )
            scale(.55);

        opacity:0;
    }
}


/* =========================================================
   SON YAZI
========================================================= */

#finalText{
    position:fixed;

    left:50%;
    top:76%;

    width:94%;

    transform:
        translate(-50%,20px);

    text-align:center;

    z-index:200;

    opacity:0;

    animation:
        finalIn
        1.5s
        ease
        forwards;
}

.finalMain{
    font-size:
        clamp(25px,6vw,52px);

    font-weight:900;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 25px #ff1493,
        0 0 55px #ff1493;
}

.finalSub{
    margin-top:9px;

    font-size:
        clamp(19px,5vw,34px);

    color:#ffb9dc;

    font-weight:bold;

    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;

    animation:
        subGlow
        1.2s
        ease-in-out
        infinite
        alternate;
}

@keyframes finalIn{

    from{
        opacity:0;

        transform:
            translate(-50%,35px)
            scale(.9);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,0)
            scale(1);
    }
}

@keyframes subGlow{

    from{
        transform:scale(1);
        text-shadow:
            0 0 8px #ff1493;
    }

    to{
        transform:scale(1.05);
        text-shadow:
            0 0 12px #ff1493,
            0 0 30px #ff1493;
    }
}


/* =========================================================
   EKRAN SARSINTISI
========================================================= */

.shake{
    animation:
        screenShake
        .45s
        ease;
}

@keyframes screenShake{

    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-10px,6px);
    }

    40%{
        transform:translate(9px,-7px);
    }

    60%{
        transform:translate(-6px,-5px);
    }

    80%{
        transform:translate(7px,5px);
    }

    100%{
        transform:translate(0,0);
    }
}

</style>
</head>


<body>


<!-- =========================================================
     YILDIZLAR
========================================================= -->

<div id="stars"></div>


<!-- =========================================================
     ANA EKRAN
========================================================= -->

<div id="screen">

    <div id="content">

        <div class="tap">
            Ekrana tıkla ❤️
        </div>

    </div>

</div>


<!-- =========================================================
     ROKET
========================================================= -->

<div id="rocket">

    <div class="rocketWing left"></div>
    <div class="rocketWing right"></div>

    <div class="rocketBody">

        <div class="rocketNose"></div>

        <div class="rocketWindow"></div>

        <div class="rocketStripe"></div>

    </div>

    <div class="rocketEngine"></div>

</div>


<!-- =========================================================
     ALEV
========================================================= -->

<div id="flame">

    <div class="flameOuter"></div>
    <div class="flameInner"></div>

</div>


<!-- =========================================================
     PATLAMA
========================================================= -->

<div id="flash"></div>


<!-- =========================================================
     KALP SAHNESİ
========================================================= -->

<div id="heartScene"></div>

<div id="megaHeart"></div>

<div id="innerHeart">
    ❤️
</div>


<script>

/* =========================================================
   ELEMENTLER
========================================================= */

const screen =
    document.getElementById("screen");

const content =
    document.getElementById("content");

const rocket =
    document.getElementById("rocket");

const flame =
    document.getElementById("flame");

const flash =
    document.getElementById("flash");

const heartScene =
    document.getElementById("heartScene");

const megaHeart =
    document.getElementById("megaHeart");

const innerHeart =
    document.getElementById("innerHeart");


let step = 0;
let finished = false;


/* =========================================================
   YILDIZLARI OLUŞTUR
========================================================= */

function createStars(){

    const stars =
        document.getElementById("stars");

    for(let i=0;i<110;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.setProperty(
            "--time",
            (1.5 + Math.random()*3) + "s"
        );

        star.style.setProperty(
            "--opacity",
            (.15 + Math.random()*.7)
        );

        stars.appendChild(star);
    }
}

createStars();


/* =========================================================
   MESAJLAR
========================================================= */

const messages = [

    "Tıkla Fatih... ❤️",

    "Sana bir şey söyleyeceğim...",

    "İyi ki...",

    "İyi ki seni tanımışım... 🥹",

    "Seni çok seviyorum...",

    "Pampimmmmmmm ❤️"

];


/* =========================================================
   EKRANA TIKLAMA
========================================================= */

screen.addEventListener(
    "click",
    function(){

        if(finished)
            return;


        /*
           Son mesaj:
           Pampim ekrana geldiği anda
           geri sayım başlar.
        */

        if(step === messages.length - 1){

            content.innerHTML = `

                <div id="pampimBox">

                    <div class="message">
                        Pampimmmmmmm ❤️
                    </div>

                    <div id="countdown">
                        7
                    </div>

                </div>

            `;

            step++;

            startCountdown();

            return;
        }


        content.innerHTML = `

            <div class="message">
                ${messages[step]}
            </div>

        `;

        step++;

    }
);


/* =========================================================
   GERİ SAYIM
========================================================= */

function startCountdown(){

    let number = 7;


    const timer =
        setInterval(
            function(){

                number--;


                if(number > 0){

                    const counter =
                        document.getElementById(
                            "countdown"
                        );

                    if(counter){

                        counter.textContent =
                            number;

                        counter.style.animation =
                            "none";

                        void counter.offsetWidth;

                        counter.style.animation =
                            "countIn .7s ease";
                    }

                }
                else{

                    clearInterval(timer);

                    content.innerHTML = "";

                    launchRocket();
                }

            },
            1000
        );
}


/* =========================================================
   ROKET
========================================================= */

function launchRocket(){

    finished = true;

    rocket.classList.add(
        "rocketActive"
    );

    flame.classList.add(
        "flameActive"
    );


    /*
       Duman sürekli oluşuyor.
    */

    const smokeTimer =
        setInterval(
            createSmoke,
            65
        );


    /*
       Roket tam yukarı vardığında
       patlıyor ve DOM'dan tamamen
       görünmez oluyor.
    */

    setTimeout(
        function(){

            clearInterval(
                smokeTimer
            );


            rocket.classList.remove(
                "rocketActive"
            );

            rocket.style.display =
                "none";


            flame.classList.remove(
                "flameActive"
            );

            flame.style.display =
                "none";


            explode();

        },
        3200
    );
}


/* =========================================================
   DUMAN
========================================================= */

function createSmoke(){

    if(
        rocket.style.display ===
        "none"
    )
        return;


    const rect =
        rocket.getBoundingClientRect();


    const smoke =
        document.createElement("div");


    smoke.className = "smoke";


    smoke.style.left =
        (
            rect.left +
            rect.width/2
        ) + "px";


    smoke.style.top =
        (
            rect.bottom - 15
        ) + "px";


    smoke.style.setProperty(
        "--sx",
        (-30 + Math.random()*60) + "px"
    );


    document.body.appendChild(
        smoke
    );


    setTimeout(
        ()=>{
            smoke.remove();
        },
        1100
    );
}


/* =========================================================
   PATLAMA
========================================================= */

function explode(){

    screen.classList.add(
        "shake"
    );


    setTimeout(
        ()=>{
            screen.classList.remove(
                "shake"
            );
        },
        450
    );


    flash.classList.remove(
        "flashActive"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "flashActive"
    );


    /*
       Büyük turuncu / sarı patlama
    */

    for(let i=0;i<55;i++){

        createExplosionParticle();

    }


    /*
       İnce hızlı kıvılcımlar
    */

    for(let i=0;i<100;i++){

        createSpark();

    }


    /*
       Patlamadan sonra kalp
    */

    setTimeout(
        createHeart,
        500
    );
}


/* =========================================================
   PATLAMA PARÇACIĞI
========================================================= */

function createExplosionParticle(){

    const p =
        document.createElement("div");


    p.className =
        "explosionParticle";


    const angle =
        Math.random()*Math.PI*2;


    const distance =
        90 + Math.random()*310;


    const size =
        4 + Math.random()*13;


    p.style.width =
        size + "px";

    p.style.height =
        size + "px";


    const colors = [
        "#ffffff",
        "#fff700",
        "#ffb000",
        "#ff6800",
        "#ff1e00"
    ];


    p.style.background =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    p.style.boxShadow =
        "0 0 10px currentColor";


    p.style.setProperty(
        "--x",
        Math.cos(angle)*distance + "px"
    );


    p.style.setProperty(
        "--y",
        Math.sin(angle)*distance + "px"
    );


    document.body.appendChild(p);


    setTimeout(
        ()=>{
            p.remove();
        },
        1400
    );
}


/* =========================================================
   KIVILCIM
========================================================= */

function createSpark(){

    const p =
        document.createElement("div");


    p.className =
        "sparkle";


    const angle =
        Math.random()*Math.PI*2;


    const distance =
        120 + Math.random()*430;


    p.style.setProperty(
        "--x",
        Math.cos(angle)*distance + "px"
    );


    p.style.setProperty(
        "--y",
        Math.sin(angle)*distance + "px"
    );


    document.body.appendChild(p);


    setTimeout(
        ()=>{
            p.remove();
        },
        1500
    );
}


/* =========================================================
   KALP DENKLEMİ
========================================================= */

function heartPoint(t){

    return {

        x:
            16 *
            Math.pow(
                Math.sin(t),
                3
            ),

        y:
            -(
                13 *
                Math.cos(t)

                -
                5 *
                Math.cos(2*t)

                -
                2 *
                Math.cos(3*t)

                -
                Math.cos(4*t)
            )

    };
}


/* =========================================================
   KALBİ OLUŞTUR
========================================================= */

function createHeart(){

    const centerX =
        window.innerWidth/2;

    const centerY =
        window.innerHeight*.42;


    /*
       DIŞ KALP
    */

    const outerCount = 220;


    for(
        let i=0;
        i<outerCount;
        i++
    ){

        const t =
            Math.PI*2 *
            i/outerCount;


        const p =
            heartPoint(t);


        createHeartParticle(
            p.x*13,
            p.y*13
        );
    }


    /*
       İÇ DOLGU
    */

    for(
        let i=0;
        i<260;
        i++
    ){

        const t =
            Math.random()*
            Math.PI*2;


        const p =
            heartPoint(t);


        /*
           Kalbin içine dağıt.
        */

        const scale =
            .15 +
            Math.random()*.82;


        createHeartParticle(
            p.x*13*scale,
            p.y*13*scale
        );
    }


    /*
       Arkadaki büyük neon kalp.
    */

    setTimeout(
        ()=>{
            megaHeart.classList.add(
                "active"
            );
        },
        700
    );


    /*
       İçinden yeni kalp doğuyor.
    */

    setTimeout(
        ()=>{
            innerHeart.classList.add(
                "innerActive"
            );

            createRing();

            createSparkleBurst(35);

        },
        1600
    );


    /*
       Kalp atışları.
    */

    setTimeout(
        pulse,
        2700
    );

    setTimeout(
        pulse,
        3400
    );

    setTimeout(
        pulse,
        4100
    );


    /*
       Küçük kalpler.
    */

    setTimeout(
        floatingHearts,
        2500
    );


    /*
       Final yazısı.
    */

    setTimeout(
        showFinalText,
        4700
    );
}


/* =========================================================
   KALP PARÇASI
========================================================= */

function createHeartParticle(
    x,
    y
){

    const heart =
        document.createElement("div");


    heart.className =
        "heartParticle";


    const symbols = [
        "❤️",
        "💗",
        "💖",
        "💕"
    ];


    heart.innerHTML =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.setProperty(
        "--x",
        x + "px"
    );


    heart.style.setProperty(
        "--y",
        y + "px"
    );


    heart.style.setProperty(
        "--size",
        (
            9 +
            Math.random()*12
        ) + "px"
    );


    heart.style.animationDelay =
        (
            Math.random()*.3
        ) + "s";


    heartScene.appendChild(

    setTimeout(
        ()=>{
            heart.remove();
        },

    );
}


/* =========================================================
   İÇ KALP ATIŞI
========================================================= */

function pulse(){

    innerHeart.classList.remove(
        "pulse"
    );

    void innerHeart.offsetWidth;

    innerHeart.classList.add(
        "pulse"
    );


    createRing();

    createSparkleBurst(12);
}


/* =========================================================
   HALKA
========================================================= */

function createRing(){

    const ring =
        document.createElement("div");


    ring.className =
        "ring";


    document.body.appendChild(ring);


    setTimeout(
        ()=>{
            ring.remove();
        },
        1600
    );
}


/* =========================================================
   IŞIK PATLAMASI
========================================================= */

function createSparkleBurst(
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const sparkle =
            document.createElement("div");


        sparkle.className =
            "sparkle";


        const angle =
            Math.random()*
            Math.PI*2;


        const distance =
            60 +
            Math.random()*180;


        sparkle.style.setProperty(
            "--x",
            Math.cos(angle)*
            distance +
            "px"
        );


        sparkle.style.setProperty(
            "--y",
            Math.sin(angle)*
            distance +
            "px"
        );


        document.body.appendChild(
            sparkle
        );


        setTimeout(
            ()=>{
                sparkle.remove();
            },
            1500
        );
    }
}


/* =========================================================
   KÜÇÜK KALPLER
========================================================= */

function floatingHearts(){

    let count = 0;


    const timer =
        setInterval(
            ()=>{
                
                createFloatingHeart();

                count++;


                if(count >= 30){

                    clearInterval(
                        timer
                    );
                }

            },
            240
        );
}
