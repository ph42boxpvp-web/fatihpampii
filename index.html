<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030006;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(circle at 50% 90%,#310047 0%,#100018 45%,#020005 100%);
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#stars{
    z-index:1;
}

#effects{
    z-index:10;
}

#screen{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
}

#content{
    position:relative;
    width:100%;
    padding:20px;
}

.message{
    color:white;
    font-size:clamp(28px,8vw,58px);
    font-weight:bold;
    line-height:1.3;
    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff1493,
        0 0 55px #ff1493;
    animation:textIn .65s cubic-bezier(.2,.8,.2,1);
}

.tap{
    color:#ffd6ec;
    font-size:22px;
    animation:blink 1.2s infinite;
}

#pampimArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

#countdown{
    font-size:clamp(75px,20vw,135px);
    font-weight:bold;
    color:#ff4fa3;
    text-shadow:
        0 0 15px #ff4fa3,
        0 0 40px #ff1493,
        0 0 80px #ff1493;
    animation:countIn .7s ease;
}

/* =========================
   ROKET
========================= */

#rocket{
    position:fixed;
    left:50%;
    bottom:-190px;
    width:76px;
    height:155px;
    transform:translateX(-50%);
    z-index:30;
    display:none;
}

#rocket.active{
    display:block;
    animation:rocketFly 2.5s cubic-bezier(.25,.75,.2,1) forwards;
}

.rocket-body{
    position:absolute;
    left:50%;
    bottom:20px;
    width:48px;
    height:105px;
    transform:translateX(-50%);
    border-radius:50% 50% 17px 17px;
    background:
        linear-gradient(
            90deg,
            #4b4b4b,
            #ddd 20%,
            #fff 48%,
            #c9c9c9 75%,
            #4a4a4a
        );
    box-shadow:
        inset 5px 0 7px rgba(255,255,255,.65),
        inset -6px 0 8px rgba(0,0,0,.45),
        0 0 10px rgba(255,255,255,.2);
}

.nose{
    position:absolute;
    left:0;
    top:-32px;
    width:48px;
    height:38px;
    background:linear-gradient(90deg,#666,#fff,#aaa);
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.window{
    position:absolute;
    left:50%;
    top:22px;
    width:23px;
    height:23px;
    transform:translateX(-50%);
    border-radius:50%;
    border:4px solid #555;
    background:radial-gradient(circle at 35% 30%,#fff,#58dcff 35%,#07559e);
    box-shadow:0 0 10px #50d8ff;
}

.line{
    position:absolute;
    left:0;
    top:58px;
    width:100%;
    height:5px;
    background:#ff164d;
}

.wing{
    position:absolute;
    bottom:19px;
    width:30px;
    height:58px;
    background:linear-gradient(135deg,#ff315f,#7d002c);
    z-index:-1;
}

.wing.left{
    left:0;
    transform:translateX(-20px);
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.wing.right{
    right:0;
    transform:translateX(20px);
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.engine{
    position:absolute;
    left:50%;
    bottom:5px;
    width:26px;
    height:22px;
    transform:translateX(-50%);
    background:#222;
    border-radius:0 0 10px 10px;
}

/* Alev */

#flame{
    position:fixed;
    left:50%;
    bottom:-45px;
    width:38px;
    height:95px;
    transform:translateX(-50%);
    z-index:29;
    display:none;
    pointer-events:none;
}

#flame.active{
    display:block;
}

.flameCore{
    position:absolute;
    left:50%;
    top:0;
    width:25px;
    height:90px;
    transform:translateX(-50%);
    border-radius:50% 50% 65% 65%;
    background:linear-gradient(
        to bottom,
        white 0%,
        #fff700 20%,
        #ff8c00 55%,
        #ff2100 100%
    );
    filter:
        blur(2px)
        drop-shadow(0 0 12px #ff8c00)
        drop-shadow(0 0 30px #ff2600);
    animation:flame .08s infinite alternate;
}

/* =========================
   BÜYÜK KALP
========================= */

#heartScene{
    position:fixed;
    left:50%;
    top:43%;
    width:min(80vw,390px);
    height:min(80vw,390px);
    transform:translate(-50%,-50%);
    z-index:50;
    opacity:0;
    pointer-events:none;
}

#heartScene.show{
    animation:heartSceneIn 1.1s ease forwards;
}

.heartGlow{
    position:absolute;
    inset:4%;
    background:#ff1493;
    opacity:.13;
    filter:blur(25px);
    clip-path:polygon(
        50% 92%,
        10% 48%,
        12% 25%,
        28% 12%,
        50% 28%,
        72% 12%,
        88% 25%,
        90% 48%
    );
}

.bigHeart{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:min(58vw,300px);
    line-height:1;
    color:#ff1493;
    filter:
        drop-shadow(0 0 10px #ff1493)
        drop-shadow(0 0 30px #ff1493)
        drop-shadow(0 0 70px #ff1493);
    animation:heartbeat 1.4s ease-in-out infinite;
}

#heartText{
    position:fixed;
    left:50%;
    top:76%;
    width:92%;
    transform:translateX(-50%);
    z-index:70;
    text-align:center;
    opacity:0;
    pointer-events:none;
}

#heartText.show{
    animation:textIn 1s ease forwards;
}

.finalMain{
    color:#fff;
    font-size:clamp(23px,6vw,48px);
    font-weight:bold;
    text-shadow:
        0 0 10px #ff4fa3,
        0 0 30px #ff1493,
        0 0 60px #ff1493;
}

.finalPampim{
    margin-top:10px;
    color:#ffb6da;
    font-size:clamp(19px,5vw,32px);
    font-weight:bold;
    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;
}

/* =========================
   ANİMASYONLAR
========================= */

@keyframes textIn{
    from{
        opacity:0;
        transform:translateY(18px) scale(.94);
        filter:blur(5px);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

@keyframes blink{
    0%,100%{opacity:.35}
    50%{opacity:1}
}

@keyframes countIn{
    from{
        opacity:0;
        transform:scale(1.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes rocketFly{
    0%{
        bottom:-190px;
        transform:translateX(-50%) rotate(-2deg);
    }
    20%{
        transform:translateX(-50%) rotate(2deg);
    }
    40%{
        transform:translateX(-50%) rotate(-1.5deg);
    }
    60%{
        transform:translateX(-50%) rotate(1deg);
    }
    80%{
        transform:translateX(-50%) rotate(-.5deg);
    }
    100%{
        bottom:55%;
        transform:translateX(-50%) rotate(0);
    }
}

@keyframes flame{
    from{
        transform:translateX(-50%) scaleY(1);
    }
    to{
        transform:translateX(-50%) scaleY(.62);
    }
}

@keyframes heartSceneIn{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.15);
    }
    45%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.08);
    }
    70%{
        transform:translate(-50%,-50%) scale(.95);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }
    15%{
        transform:scale(1.10);
    }
    28%{
        transform:scale(.96);
    }
    42%{
        transform:scale(1.06);
    }
    58%{
        transform:scale(1);
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="effects"></canvas>

<div id="screen">
    <div id="content">
        <div class="tap">Ekrana tıkla ❤️</div>
    </div>
</div>

<div id="rocket">
    <div class="wing left"></div>
    <div class="wing right"></div>

    <div class="rocket-body">
        <div class="nose"></div>
        <div class="window"></div>
        <div class="line"></div>
    </div>

    <div class="engine"></div>
</div>

<div id="flame">
    <div class="flameCore"></div>
</div>

<div id="heartScene">
    <div class="heartGlow"></div>
    <div class="bigHeart">❤️</div>
</div>

<div id="heartText">
    <div class="finalMain">
        Seni çok seviyorum Fatih ❤️
    </div>
    <div class="finalPampim">
        Pampimmmmmmm 🥹❤️
    </div>
</div>

<script>
/* =====================================================
   TEMEL
===================================================== */

const screen = document.getElementById("screen");
const content = document.getElementById("content");
const rocket = document.getElementById("rocket");
const flame = document.getElementById("flame");
const heartScene = document.getElementById("heartScene");
const heartText = document.getElementById("heartText");

let step = 0;
let finished = false;
let countdownStarted = false;

const messages = [
    "Tıkla Fatih... ❤️",
    "Sana bir şey söyleyeceğim...",
    "İyi ki...",
    "İyi ki seni tanımışım... 🥹",
    "Seni çok seviyorum..."
];

/* =====================================================
   YAZILAR
===================================================== */

function showMessage(text){
    content.innerHTML = "";

    const div = document.createElement("div");
    div.className = "message";
    div.textContent = text;

    content.appendChild(div);
}

/* =====================================================
   TIKLAMA
===================================================== */

screen.addEventListener("click", () => {

    if(finished) return;

    if(step < messages.length){

        showMessage(messages[step]);

        step++;

        return;
    }

    if(step === messages.length && !countdownStarted){

        countdownStarted = true;

        content.innerHTML = `
            <div id="pampimArea">
                <div class="message">Pampimmmmmmm ❤️</div>
                <div id="countdown">7</div>
            </div>
        `;

        startCountdown();
    }
});

/* =====================================================
   GERİ SAYIM
===================================================== */

function startCountdown(){

    let number = 7;

    const timer = setInterval(() => {

        number--;

        const counter =
            document.getElementById("countdown");

        if(number > 0){

            if(counter){

                counter.textContent = number;

                counter.style.animation = "none";
                void counter.offsetWidth;
                counter.style.animation =
                    "countIn .7s ease";
            }

        }else{

            clearInterval(timer);

            content.innerHTML = "";

            launchRocket();
        }

    },1000);
}

/* =====================================================
   ROKET
===================================================== */

function launchRocket(){

    finished = true;

    rocket.classList.add("active");
    flame.classList.add("active");

    startSmoke();

    setTimeout(() => {

        stopSmoke();

        /*
         * Roketi ve alevi gerçekten DOM'dan
         * görünmez hale getiriyoruz.
         */
        rocket.classList.remove("active");
        rocket.style.display = "none";

        flame.classList.remove("active");
        flame.style.display = "none";

        createExplosion();

    },2500);
}

/* =====================================================
   CANVAS
===================================================== */

const starCanvas = document.getElementById("stars");
const fxCanvas = document.getElementById("effects");

const starCtx = starCanvas.getContext("2d");
const fxCtx = fxCanvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;
let dpr = Math.min(window.devicePixelRatio || 1,2);

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1,2);

    starCanvas.width = W*dpr;
    starCanvas.height = H*dpr;

    fxCanvas.width = W*dpr;
    fxCanvas.height = H*dpr;

    starCtx.setTransform(dpr,0,0,dpr,0,0);
    fxCtx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =====================================================
   YILDIZLAR
===================================================== */

const stars = [];

for(let i=0;i<95;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:.4+Math.random()*1.5,
        a:.25+Math.random()*.65,
        speed:.002+Math.random()*.006,
        phase:Math.random()*Math.PI*2
    });
}

function drawStars(time){

    starCtx.clearRect(0,0,W,H);

    for(const s of stars){

        const alpha =
            s.a +
            Math.sin(time*s.speed+s.phase)*.18;

        starCtx.beginPath();
        starCtx.arc(s.x,s.y,s.r,0,Math.PI*2);

        starCtx.fillStyle =
            `rgba(255,220,245,${Math.max(.08,alpha)})`;

        starCtx.shadowBlur = 6;
        starCtx.shadowColor = "#ff9ed0";

        starCtx.fill();
    }

    starCtx.shadowBlur = 0;
}

/* =====================================================
   PATLAMA PARÇACIKLARI
===================================================== */

const particles = [];

function createExplosion(){

    const x = W/2;
    const y = H*.45;

    /*
     * Büyük merkez flaşı
     */
    particles.push({
        x:x,
        y:y,
        vx:0,
        vy:0,
        life:1,
        size:40,
        type:"flash"
    });

    /*
     * Ateş parçacıkları
     */
    for(let i=0;i<48;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            3 + Math.random()*8;

        particles.push({
            x:x,
            y:y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:.75+Math.random()*.45,
            size:2+Math.random()*5,
            type:"fire"
        });
    }

    /*
     * Beyaz kıvılcımlar
     */
    for(let i=0;i<65;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            2+Math.random()*10;

        particles.push({
            x:x,
            y:y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:.7+Math.random()*.7,
            size:1+Math.random()*2.5,
            type:"spark"
        });
    }

    /*
     * Patlamadan sonra kalp
     */
    setTimeout(() => {
        showHeart();
    },700);
}

/* =====================================================
   DUMAN
===================================================== */

let smokeTimer = null;

function startSmoke(){

    smokeTimer = setInterval(() => {

        if(rocket.style.display === "none")
            return;

        const rect =
            rocket.getBoundingClientRect();

        /*
         * Canvas parçacığı kullanıyoruz.
         * Böylece yüzlerce DOM elementi oluşmuyor.
         */

        const smokeCount = 2;

        for(let i=0;i<smokeCount;i++){

            particles.push({
                x:rect.left+rect.width/2+
                   (Math.random()-.5)*12,

                y:rect.bottom-8,

                vx:(Math.random()-.5)*.8,

                vy:.8+Math.random()*1.5,

                life:.45+Math.random()*.35,

                size:6+Math.random()*8,

                type:"smoke"
            });
        }

    },55);
}

function stopSmoke(){

    if(smokeTimer){

        clearInterval(smokeTimer);
        smokeTimer=null;
    }
}

/* =====================================================
   KALP
===================================================== */

const heartParticles = [];

function heartEquation(t){

    return {
        x:16*Math.pow(Math.sin(t),3),

        y:-(
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t)
        )
    };
}

function showHeart(){

    /*
     * Patlama parçalarını temizle
     */
    particles.length = 0;

    /*
     * Canvas üzerinde kalp parçacıkları.
     * Sadece yaklaşık 90 parçacık.
     */
    heartParticles.length = 0;

    const count = 95;

    for(let i=0;i<count;i++){

        const t =
            Math.PI*2*(i/count);

        const p = heartEquation(t);

        heartParticles.push({
            x:W/2,
            y:H*.45,

            tx:W/2+p.x*11.5,
            ty:H*.45+p.y*11.5,

            progress:0,

            size:2+Math.random()*3,

            color:[
                "#ff174f",
                "#ff4fa3",
                "#ff79bd",
                "#ff1493"
            ][Math.floor(Math.random()*4)]
        });
    }

    heartScene.classList.add("show");

    setTimeout(() => {

        heartText.classList.add("show");

    },650);
}

/* =====================================================
   ANA ANİMASYON
===================================================== */

function animate(time){

    drawStars(time);

    fxCtx.clearRect(0,0,W,H);

    /* PATLAMA */

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.life -= .018;

        if(p.type !== "flash"){

            p.x += p.vx;
            p.y += p.vy;

            p.vy += .045;
            p.vx *= .992;
            p.vy *= .992;
        }

        if(p.life<=0){

            particles.splice(i,1);
            continue;
        }

        if(p.type==="flash"){

            const radius =
                (1-p.life)*180;

            const gradient =
                fxCtx.createRadialGradient(
                    p.x,p.y,0,
                    p.x,p.y,radius
                );

            gradient.addColorStop(0,
                `rgba(255,255,255,${p.life})`);

            gradient.addColorStop(.2,
                `rgba(255,240,100,${p.life*.8})`);

            gradient.addColorStop(.55,
                `rgba(255,90,0,${p.life*.35})`);

            gradient.addColorStop(1,
                "rgba(255,0,0,0)");

            fxCtx.fillStyle=gradient;

            fxCtx.beginPath();
            fxCtx.arc(p.x,p.y,radius,0,Math.PI*2);
            fxCtx.fill();

        }else if(p.type==="fire"){

            fxCtx.beginPath();
            fxCtx.arc(
                p.x,p.y,
                p.size*p.life,
                0,Math.PI*2
            );

            fxCtx.fillStyle =
                `rgba(255,${120+Math.random()*100},20,${p.life})`;

            fxCtx.shadowBlur=15;
            fxCtx.shadowColor="#ff4500";

            fxCtx.fill();

        }else if(p.type==="spark"){

            fxCtx.beginPath();
            fxCtx.arc(
                p.x,p.y,
                p.size*p.life,
                0,Math.PI*2
            );

            fxCtx.fillStyle =
                `rgba(255,255,230,${p.life})`;

            fxCtx.shadowBlur=10;
            fxCtx.shadowColor="#fff";

            fxCtx.fill();

        }else if(p.type==="smoke"){

            fxCtx.beginPath();
            fxCtx.arc(
                p.x,p.y,
                p.size*(1-p.life+.3),
                0,Math.PI*2
            );

            fxCtx.fillStyle =
                `rgba(180,180,190,${p.life*.25})`;

            fxCtx.shadowBlur=12;
            fxCtx.shadowColor="#aaa";

            fxCtx.fill();
        }
    }

    fxCtx.shadowBlur=0;

    /* KALP PARÇACIKLARI */

    for(const p of heartParticles){

        p.progress += .035;

        const t =
            Math.min(p.progress,1);

        /*
         * Ease-out
         */
        const ease =
            1-Math.pow(1-t,3);

        const x =
            p.x+(p.tx-p.x)*ease;

        const y =
            p.y+(p.ty-p.y)*ease;

        const alpha =
            Math.min(1,t*3);

        fxCtx.beginPath();

        fxCtx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        fxCtx.fillStyle =
            p.color;

        fxCtx.globalAlpha=alpha;

        fxCtx.shadowBlur=10;
        fxCtx.shadowColor="#ff1493";

        fxCtx.fill();

        fxCtx.globalAlpha=1;
    }

    fxCtx.shadowBlur=0;

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
