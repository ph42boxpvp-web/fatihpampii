<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fatih ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background:
        radial-gradient(
            circle at 50% 100%,
            #32004d 0%,
            #11001c 45%,
            #030007 100%
        );

    color: white;

    font-family: Arial, sans-serif;
}


/* =========================
   ANA EKRAN
========================= */

#screen {

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    cursor: pointer;

    transition: filter .2s;
}


#content {

    position: relative;

    z-index: 100;

    padding: 25px;

}


.message {

    font-size:
        clamp(30px, 8vw, 60px);

    font-weight: bold;

    line-height: 1.3;

    animation: appear .8s ease;

    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff4fa3,
        0 0 50px #ff1493;
}


.tap {

    font-size: 22px;

    color: #ffd6ec;

    animation: blink 1.2s infinite;
}


/* =========================
   GERİ SAYIM
========================= */

#countdown {

    font-size:
        clamp(100px, 30vw, 180px);

    font-weight: bold;

    color: #ff4fa3;

    text-shadow:
        0 0 15px #ff4fa3,
        0 0 40px #ff1493,
        0 0 80px #ff1493;

    animation: countdownAnim .9s ease;
}


/* =========================
   ROKET
========================= */

#rocket {

    position: fixed;

    left: 50%;

    bottom: -180px;

    width: 90px;

    height: 190px;

    transform:
        translateX(-50%);

    z-index: 80;

    display: none;
}


/* Roket gövdesi */

.rocket-body {

    position: absolute;

    left: 50%;

    bottom: 35px;

    width: 56px;

    height: 125px;

    transform:
        translateX(-50%);

    border-radius:
        50% 50% 15% 15%;

    background:
        linear-gradient(
            90deg,
            #777,
            #eee 25%,
            white 50%,
            #aaa 80%,
            #666
        );

    box-shadow:
        inset 5px 0 8px rgba(255,255,255,.7),
        inset -7px 0 10px rgba(0,0,0,.35),
        0 0 15px rgba(255,255,255,.2);
}


/* Burun */

.rocket-nose {

    position: absolute;

    left: 0;

    top: -28px;

    width: 56px;

    height: 45px;

    background:
        linear-gradient(
            90deg,
            #666,
            #fff,
            #aaa
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}


/* Pencere */

.rocket-window {

    position: absolute;

    top: 27px;

    left: 50%;

    width: 25px;

    height: 25px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    border: 4px solid #555;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #55d7ff 35%,
            #07559b 100%
        );

    box-shadow:
        0 0 10px #49caff;
}


/* Kırmızı çizgi */

.rocket-line {

    position: absolute;

    left: 0;

    width: 100%;

    height: 6px;

    background:
        #ff174f;
}

.rocket-line.one {
    top: 65px;
}


/* Kanatlar */

.rocket-wing {

    position: absolute;

    bottom: 38px;

    width: 30px;

    height: 62px;

    background:
        linear-gradient(
            135deg,
            #ff315f,
            #8c0030
        );

    z-index: -1;
}


.rocket-wing.left {

    left: 4px;

    transform:
        translateX(-22px);

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}


.rocket-wing.right {

    right: 4px;

    transform:
        translateX(22px);

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}


/* Motor */

.rocket-engine {

    position: absolute;

    left: 50%;

    bottom: 18px;

    width: 32px;

    height: 22px;

    transform:
        translateX(-50%);

    background: #222;

    border-radius:
        0 0 12px 12px;
}


/* =========================
   ROKET ALEVİ
========================= */

#flame {

    position: fixed;

    left: 50%;

    bottom: -50px;

    width: 45px;

    height: 110px;

    transform:
        translateX(-50%);

    z-index: 70;

    display: none;
}


.flame-core {

    position: absolute;

    left: 50%;

    top: 0;

    width: 28px;

    height: 95px;

    transform:
        translateX(-50%);

    border-radius:
        50% 50% 65% 65%;

    background:
        linear-gradient(
            to bottom,
            white 0%,
            #fff200 25%,
            #ff8c00 55%,
            #ff2100 100%
        );

    filter:
        blur(1px)
        drop-shadow(0 0 12px #ff8c00)
        drop-shadow(0 0 30px #ff3000);
}


.flame.show {

    display: block;

    animation:
        flameShake .07s infinite alternate;
}


/* =========================
   ROKET UÇUŞ
========================= */

.rocket-fly {

    display: block !important;

    animation:
        rocketFlight
        2.8s
        cubic-bezier(.35,.05,.2,1)
        forwards;
}


@keyframes rocketFlight {

    0% {

        bottom: -180px;

        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    15% {

        transform:
            translateX(-50%)
            rotate(3deg);
    }

    30% {

        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    45% {

        transform:
            translateX(-50%)
            rotate(2deg);
    }

    60% {

        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    75% {

        transform:
            translateX(-50%)
            rotate(1deg);
    }

    100% {

        bottom: 57%;

        transform:
            translateX(-50%)
            rotate(0);
    }
}


@keyframes flameShake {

    from {

        transform:
            translateX(-50%)
            scaleY(1);
    }

    to {

        transform:
            translateX(-50%)
            scaleY(.65);
    }
}


/* =========================
   DUMAN
========================= */

.smoke {

    position: fixed;

    width: 15px;

    height: 15px;

    border-radius: 50%;

    background:
        rgba(220,220,220,.35);

    filter: blur(5px);

    pointer-events: none;

    z-index: 20;

    animation:
        smokeAnimation
        1.2s
        ease-out
        forwards;
}


@keyframes smokeAnimation {

    0% {

        transform:
            scale(.5);

        opacity: .7;
    }

    100% {

        transform:
            scale(3);

        opacity: 0;
    }
}


/* =========================
   GERÇEK PATLAMA
========================= */

#explosionFlash {

    position: fixed;

    left: 50%;

    top: 43%;

    width: 20px;

    height: 20px;

    transform:
        translate(-50%, -50%)
        scale(0);

    border-radius: 50%;

    z-index: 90;

    pointer-events: none;
}


/*
    Patlamanın ilk beyaz flaşı
*/

.flash-active {

    animation:
        explosionFlash
        .8s
        ease-out
        forwards;
}


@keyframes explosionFlash {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.1);

        background: white;

        opacity: 1;

        box-shadow:
            0 0 20px white;
    }

    15% {

        transform:
            translate(-50%, -50%)
            scale(4);

        background: white;

        box-shadow:
            0 0 50px white,
            0 0 100px #ffe600,
            0 0 150px #ff6600;
    }

    40% {

        transform:
            translate(-50%, -50%)
            scale(12);

        background:
            #ff8c00;

        box-shadow:
            0 0 40px #ffcc00,
            0 0 100px #ff4500;
    }

    70% {

        transform:
            translate(-50%, -50%)
            scale(22);

        background:
            #ff3c00;

        opacity: .5;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(35);

        opacity: 0;
    }
}


/* =========================
   PATLAMA ALEV TOPLARI
========================= */

.explosion-ball {

    position: fixed;

    left: 50%;

    top: 43%;

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            #fff000 20%,
            #ff7b00 55%,
            #ff1e00 100%
        );

    box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ff4500;

    z-index: 89;

    pointer-events: none;

    animation:
        explosionBall
        1.2s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}


@keyframes explosionBall {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }

    25% {

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity: 0;
    }
}


/* =========================
   PATLAMA KIVILCIMLARI
========================= */

.spark {

    position: fixed;

    left: 50%;

    top: 43%;

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px #fff,
        0 0 15px #ff8c00;

    z-index: 88;

    pointer-events: none;

    animation:
        sparkFly
        .9s
        ease-out
        forwards;
}


@keyframes sparkFly {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1.5);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.1);

        opacity: 0;
    }
}


/* =========================
   KALP ALANI
========================= */

#heartParticles {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 50;
}


.heart-particle {

    position: fixed;

    left: 50%;

    top: 43%;

    opacity: 0;

    pointer-events: none;

    animation:
        heartParticle
        2.4s
        cubic-bezier(.15,.8,.25,1)
        forwards;

    filter:
        drop-shadow(
            0 0 7px #ff1493
        );
}


@keyframes heartParticle {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.05)
            rotate(0deg);

        opacity: 0;
    }

    15% {

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(var(--scale))
            rotate(var(--rotation));

        opacity: 1;
    }
}


/* =========================
   BÜYÜK KALP
========================= */

#bigHeart {

    position: fixed;

    left: 50%;

    top: 43%;

    transform:
        translate(-50%, -50%)
        scale(0);

    font-size:
        clamp(150px, 55vw, 330px);

    z-index: 100;

    opacity: 0;

    filter:
        drop-shadow(0 0 15px #ff1493)
        drop-shadow(0 0 45px #ff1493)
        drop-shadow(0 0 90px #ff1493);
}


.big-heart-show {

    animation:
        bigHeartAnimation
        1.8s
        ease
        forwards;
}


@keyframes bigHeartAnimation {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    35% {

        transform:
            translate(-50%, -50%)
            scale(1.3);

        opacity: 1;
    }

    55% {

        transform:
            translate(-50%, -50%)
            scale(.88);
    }

    75% {

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}


/* =========================
   EKRAN SARSILMASI
========================= */

.shake {

    animation:
        screenShake
        .45s
        ease;
}


@keyframes screenShake {

    0% {
        transform: translate(0,0);
    }

    20% {
        transform: translate(-10px,5px);
    }

    40% {
        transform: translate(8px,-6px);
    }

    60% {
        transform: translate(-7px,-3px);
    }

    80% {
        transform: translate(6px,5px);
    }

    100% {
        transform: translate(0,0);
    }
}


/* =========================
   GENEL
========================= */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            scale(.5);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


@keyframes blink {

    0%,100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }
}


@keyframes countdownAnim {

    from {

        transform:
            scale(1.8);

        opacity: 0;
    }

    to {

        transform:
            scale(1);

        opacity: 1;
    }
}

</style>
</head>


<body>


<div id="screen">

    <div id="content">

        <div class="tap">
            Ekrana tıkla ❤️
        </div>

    </div>

</div>


<!-- =========================
     ROKET
========================= -->

<div id="rocket">

    <div class="rocket-wing left"></div>

    <div class="rocket-wing right"></div>

    <div class="rocket-body">

        <div class="rocket-nose"></div>

        <div class="rocket-window"></div>

        <div class="rocket-line one"></div>

    </div>

    <div class="rocket-engine"></div>

</div>


<!-- Roket alevi -->

<div id="flame">

    <div class="flame-core"></div>

</div>


<!-- Patlama -->

<div id="explosionFlash"></div>


<!-- Kalp parçacıkları -->

<div id="heartParticles"></div>


<!-- Son büyük kalp -->

<div id="bigHeart">
    ❤️
</div>


<script>


const screen =
    document.getElementById("screen");

const content =
    document.getElementById("content");

const rocket =
    document.getElementById("rocket");

const flame =
    document.getElementById("flame");

const explosionFlash =
    document.getElementById("explosionFlash");

const heartParticles =
    document.getElementById("heartParticles");

const bigHeart =
    document.getElementById("bigHeart");


let step = 0;

let finished = false;


const messages = [

    "Tıkla Fatih... ❤️",

    "Sana bir şey söyleyeceğim...",

    "İyi ki...",

    "İyi ki seni tanımışım... 🥹",

    "Seni çok seviyorum...",

    "Pampimmmmmmm ❤️"

];


/* =========================
   MESAJLAR
========================= */

screen.addEventListener(
    "click",
    function() {

        if (finished)
            return;


        if (step < messages.length) {

            content.innerHTML = `
                <div class="message">
                    ${messages[step]}
                </div>
            `;


            step++;


            /*
                ÖNEMLİ:

                Pampimmmmmmm ekrana geldiği
                anda geri sayım başlıyor.

                Kullanıcı tekrar tıklamayacak.
            */

            if (step === messages.length) {

                setTimeout(
                    startCountdown,
                    350
                );

            }

        }

    }
);


/* =========================
   GERİ SAYIM
========================= */

function startCountdown() {

    let number = 7;


    showCountdown(number);


    const counter =
        setInterval(
            function() {

                number--;


                if (number > 0) {

                    showCountdown(number);

                }

                else {

                    clearInterval(counter);

                    content.innerHTML = "";

                    launchRocket();

                }

            },
            1000
        );

}


/* Sayıyı göster */

function showCountdown(number) {

    content.innerHTML = `

        <div id="countdown">
            ${number}
        </div>

    `;

}


/* =========================
   ROKET FIRLATMA
========================= */

function launchRocket() {

    finished = true;


    rocket.classList.add(
        "rocket-fly"
    );


    flame.classList.add(
        "show"
    );


    /*
        Uçuş boyunca duman
    */

    const smokeTimer =
        setInterval(
            function() {

                if (
                    rocket.style.display === "none"
                ) {

                    clearInterval(smokeTimer);

                    return;
                }


                createSmoke();

            },
            70
        );


    /*
        Roket hedefe ulaşınca
        PATLAMA
    */

    setTimeout(
        function() {

            clearInterval(smokeTimer);

            rocket.style.display =
                "none";

            flame.style.display =
                "none";


            createRocketExplosion();

        },
        2800
    );

}


/* =========================
   DUMAN
========================= */

function createSmoke() {

    const rect =
        rocket.getBoundingClientRect();


    const smoke =
        document.createElement("div");


    smoke.className =
        "smoke";


    smoke.style.left =
        (
            rect.left +
            rect.width / 2 -
            8
        ) + "px";


    smoke.style.top =
        (
            rect.bottom -
            15
        ) + "px";


    document.body.appendChild(
        smoke
    );


    setTimeout(
        function() {

            smoke.remove();

        },
        1200
    );

}


/* =========================
   ROKET PATLAMASI
========================= */

function createRocketExplosion() {


    /*
        Büyük patlama flaşı
    */

    explosionFlash.classList.remove(
        "flash-active"
    );


    void explosionFlash.offsetWidth;


    explosionFlash.classList.add(
        "flash-active"
    );


    /*
        Ekran hafif sarsılıyor
    */

    screen.classList.add(
        "shake"
    );


    setTimeout(
        function() {

            screen.classList.remove(
                "shake"
            );

        },
        450
    );


    /*
        Patlamanın büyük ateş topları
    */

    for (
        let i = 0;
        i < 38;
        i++
    ) {

        createExplosionBall();

    }


    /*
        Çok sayıda kıvılcım
    */

    for (
        let i = 0;
        i < 65;
        i++
    ) {

        createSpark();

    }


    /*
        Patlamadan biraz sonra
        kalp parçacıkları
    */

    setTimeout(
        createHeartExplosion,
        550
    );

}


/* =========================
   PATLAMA ATEŞ TOPLARI
========================= */

function createExplosionBall() {

    const ball =
        document.createElement("div");


    ball.className =
        "explosion-ball";


    const angle =
        Math.random() *
        Math.PI * 2;


    const distance =
        100 +
        Math.random() * 300;


    const x =
        Math.cos(angle) *
        distance;


    const y =
        Math.sin(angle) *
        distance;


    ball.style.setProperty(
        "--x",
        x + "px"
    );


    ball.style.setProperty(
        "--y",
        y + "px"
    );


    document.body.appendChild(
        ball
    );


    setTimeout(
        function() {

            ball.remove();

        },
        1300
    );

}


/* =========================
   KIVILCIM
========================= */

function createSpark() {

    const spark =
        document.createElement("div");


    spark.className =
        "spark";


    const angle =
        Math.random() *
        Math.PI * 2;


    const distance =
        100 +
        Math.random() * 380;


    spark.style.setProperty(
        "--x",
        Math.cos(angle) *
        distance +
        "px"
    );


    spark.style.setProperty(
        "--y",
        Math.sin(angle) *
        distance +
        "px"
    );


    document.body.appendChild(
        spark
    );


    setTimeout(
        function() {

            spark.remove();

        },
        1000
    );

}


/* =========================
   MATEMATİKSEL KALP
========================= */

/*

    Python'da kullanılan klasik
    parametrik kalp:

    x = 16 sin³(t)

    y =
    13cos(t)
    - 5cos(2t)
    - 2cos(3t)
    - cos(4t)

    Bu form internetteki Python/Turtle
    kalp örnekleriyle aynı matematiksel
    temele dayanıyor.
*/


function heartPoint(t, scale) {


    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        -(
            13 *
            Math.cos(t)

            -

            5 *
            Math.cos(2 * t)

            -

            2 *
            Math.cos(3 * t)

            -

            Math.cos(4 * t)
        );


    return {

        x: x * scale,

        y: y * scale

    };

}


/* =========================
   KALP PATLAMASI
========================= */

function createHeartExplosion() {


    /*
        Kalbin dış çizgisini oluşturuyoruz.

        Python'daki parametrik kalp
        mantığından alınmış matematik.
    */

    const amount = 150;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const t =
            Math.PI * 2 *
            (i / amount);


        const point =
            heartPoint(
                t,
                13
            );


        createHeartParticle(

            point.x,

            point.y

        );

    }


    /*
        Kalbin içini de dolduruyoruz.
    */

    for (
        let i = 0;
        i < 100;
        i++
    ) {


        const t =
            Math.random() *
            Math.PI * 2;


        const point =
            heartPoint(
                t,
                13
            );


        const inside =
            Math.random();


        createHeartParticle(

            point.x *
                inside,

            point.y *
                inside

        );

    }


    /*
        Bir süre sonra
        dev kalp geliyor.
    */

    setTimeout(
        function() {

            bigHeart.classList.add(
                "big-heart-show"
            );


            content.innerHTML = `

                <div class="message">

                    Seni çok seviyorum Fatih ❤️

                </div>

            `;


            content.style.position =
                "fixed";


            content.style.left =
                "50%";


            content.style.top =
                "80%";


            content.style.transform =
                "translateX(-50%)";


        },
        1100
    );

}


/* =========================
   KALP PARÇACIK
========================= */

function createHeartParticle(
    x,
    y
) {


    const particle =
        document.createElement("div");


    particle.className =
        "heart-particle";


    const hearts = [

        "❤️",

        "💖",

        "💕",

        "💗",

        "💓",

        "💘"

    ];


    particle.innerHTML =
        hearts[
            Math.floor(
                Math.random() *
                hearts.length
            )
        ];


    particle.style.setProperty(
        "--x",
        x + "px"
    );


    particle.style.setProperty(
        "--y",
        y + "px"
    );


    particle.style.setProperty(
        "--scale",
        (
            .45 +
            Math.random() * .7
        )
    );


    particle.style.setProperty(
        "--rotation",
        (
            Math.random() *
            360 -
            180
        ) + "deg"
    );


    particle.style.fontSize =
        (
            13 +
            Math.random() * 17
        ) + "px";


    heartParticles.appendChild(
        particle
    );


    setTimeout(
        function() {

            particle.remove();

        },
        2600
    );

}

</script>

</body>
</html>
