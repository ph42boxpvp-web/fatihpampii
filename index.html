<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Fatih ❤️</title>


<style>

/* =====================================================
   GENEL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background:
        radial-gradient(
            circle at 50% 100%,
            #35004f 0%,
            #100018 50%,
            #020005 100%
        );

    color: white;

    font-family: Arial, sans-serif;
}


/* =====================================================
   ANA EKRAN
===================================================== */

#screen {

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    cursor: pointer;
}


#content {

    position: relative;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


.message {

    font-size:
        clamp(30px, 8vw, 58px);

    font-weight: bold;

    line-height: 1.3;

    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff4fa3,
        0 0 50px #ff1493;

    animation:
        appear .7s ease;
}


.tap {

    font-size: 22px;

    color: #ffd6ec;

    animation:
        blink 1.2s infinite;
}


/* =====================================================
   PAMPİM + SAYIM
===================================================== */

#pampimArea {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 18px;
}


#countdown {

    font-size:
        clamp(75px, 20vw, 130px);

    font-weight: bold;

    color: #ff4fa3;

    text-shadow:
        0 0 10px #ff4fa3,
        0 0 30px #ff1493,
        0 0 70px #ff1493;

    animation:
        countdownAppear .8s ease;
}


/* =====================================================
   ROKET
===================================================== */

#rocket {

    position: fixed;

    left: 50%;

    bottom: -180px;

    width: 90px;
    height: 190px;

    transform:
        translateX(-50%);

    display: none;

    z-index: 50;
}


/* Roket gövdesi */

.rocket-body {

    position: absolute;

    left: 50%;
    bottom: 30px;

    width: 55px;
    height: 125px;

    transform:
        translateX(-50%);

    border-radius:
        50% 50% 18% 18%;

    background:
        linear-gradient(
            90deg,
            #555,
            #ddd 22%,
            white 50%,
            #ccc 70%,
            #555
        );

    box-shadow:
        inset 6px 0 10px rgba(255,255,255,.7),
        inset -7px 0 10px rgba(0,0,0,.4);
}


/* Roket burnu */

.rocket-nose {

    position: absolute;

    top: -30px;
    left: 0;

    width: 55px;
    height: 45px;

    background:
        linear-gradient(
            90deg,
            #666,
            #fff,
            #aaa
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}


/* Roket camı */

.rocket-window {

    position: absolute;

    top: 27px;
    left: 50%;

    width: 25px;
    height: 25px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    border:
        4px solid #555;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #54d9ff 35%,
            #07559e 100%
        );

    box-shadow:
        0 0 10px #4fd6ff;
}


/* Roket çizgisi */

.rocket-line {

    position: absolute;

    left: 0;
    top: 67px;

    width: 100%;
    height: 6px;

    background:
        #ff164d;
}


/* Kanatlar */

.rocket-wing {

    position: absolute;

    bottom: 32px;

    width: 32px;
    height: 65px;

    background:
        linear-gradient(
            135deg,
            #ff315f,
            #81002d
        );

    z-index: -1;
}


.rocket-wing.left {

    left: 2px;

    transform:
        translateX(-22px);

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}


.rocket-wing.right {

    right: 2px;

    transform:
        translateX(22px);

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}


/* Motor */

.rocket-engine {

    position: absolute;

    left: 50%;
    bottom: 15px;

    width: 30px;
    height: 25px;

    transform:
        translateX(-50%);

    background:
        #222;

    border-radius:
        0 0 12px 12px;
}


/* =====================================================
   ROKET ALEVİ
===================================================== */

#flame {

    position: fixed;

    left: 50%;

    bottom: -55px;

    width: 45px;
    height: 110px;

    transform:
        translateX(-50%);

    display: none;

    z-index: 45;
}


.flame-core {

    width: 30px;
    height: 100px;

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius:
        50% 50% 70% 70%;

    background:
        linear-gradient(
            to bottom,
            white 0%,
            #fff700 20%,
            #ff8c00 55%,
            #ff1e00 100%
        );

    filter:
        blur(2px)
        drop-shadow(0 0 15px #ff7b00)
        drop-shadow(0 0 35px #ff2600);
}


.flame-active {

    display: block;

    animation:
        flameShake .07s infinite alternate;
}


/* =====================================================
   ROKET UÇUŞU
===================================================== */

.rocket-active {

    display: block !important;

    animation:
        rocketFlight
        2.7s
        cubic-bezier(.25,.05,.15,1)
        forwards;
}


@keyframes rocketFlight {

    0% {

        bottom: -180px;

        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    15% {

        transform:
            translateX(-50%)
            rotate(3deg);
    }

    30% {

        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    45% {

        transform:
            translateX(-50%)
            rotate(2deg);
    }

    60% {

        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    80% {

        transform:
            translateX(-50%)
            rotate(1deg);
    }

    100% {

        bottom: 57%;

        transform:
            translateX(-50%)
            rotate(0deg);
    }
}


@keyframes flameShake {

    from {

        transform:
            translateX(-50%)
            scaleY(1);
    }

    to {

        transform:
            translateX(-50%)
            scaleY(.6);
    }
}


/* =====================================================
   DUMAN
===================================================== */

.smoke {

    position: fixed;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background:
        rgba(210,210,210,.4);

    filter:
        blur(5px);

    z-index: 10;

    pointer-events: none;

    animation:
        smoke .9s ease-out forwards;
}


@keyframes smoke {

    0% {

        transform:
            scale(.5);

        opacity: .8;
    }

    100% {

        transform:
            scale(3);

        opacity: 0;
    }
}


/* =====================================================
   ANA PATLAMA
===================================================== */

#blast {

    position: fixed;

    left: 50%;
    top: 43%;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 80;

    pointer-events: none;
}


.blast-active {

    animation:
        blast
        1.1s
        ease-out
        forwards;
}


@keyframes blast {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.1);

        background:
            white;

        box-shadow:
            0 0 20px white;

        opacity: 1;
    }

    12% {

        transform:
            translate(-50%, -50%)
            scale(3);

        background:
            white;

        box-shadow:
            0 0 40px white,
            0 0 80px #ffe600,
            0 0 130px #ff6600;
    }

    30% {

        transform:
            translate(-50%, -50%)
            scale(8);

        background:
            radial-gradient(
                circle,
                #fff,
                #ffea00 25%,
                #ff7300 60%,
                #ff1700 100%
            );

        box-shadow:
            0 0 50px #ffcc00,
            0 0 120px #ff4500;
    }

    55% {

        transform:
            translate(-50%, -50%)
            scale(14);

        opacity: .85;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(27);

        opacity: 0;
    }
}


/* =====================================================
   ATEŞ TOPLARI
===================================================== */

.fireball {

    position: fixed;

    left: 50%;
    top: 43%;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            #fff000 20%,
            #ff8c00 55%,
            #ff1b00 100%
        );

    box-shadow:
        0 0 10px white,
        0 0 25px #ff8c00,
        0 0 45px #ff2600;

    z-index: 82;

    pointer-events: none;

    animation:
        fireballFly
        1.2s
        cubic-bezier(.1,.6,.2,1)
        forwards;
}


@keyframes fireballFly {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1.5);

        opacity: 1;
    }

    25% {

        transform:
            translate(
                calc(-50% + var(--x) * .35),
                calc(-50% + var(--y) * .35)
            )
            scale(2);
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity: 0;
    }
}


/* =====================================================
   KIVILCIMLAR
===================================================== */

.spark {

    position: fixed;

    left: 50%;
    top: 43%;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        white;

    box-shadow:
        0 0 8px white,
        0 0 15px #ff8500;

    z-index: 84;

    pointer-events: none;

    animation:
        sparkFly
        1.3s
        ease-out
        forwards;
}


@keyframes sparkFly {

    from {

        transform:
            translate(-50%, -50%)
            scale(1.5);

        opacity: 1;
    }

    to {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.1);

        opacity: 0;
    }
}


/* =====================================================
   ROKET PARÇALARI
===================================================== */

.rocket-piece {

    position: fixed;

    left: 50%;
    top: 43%;

    background:
        linear-gradient(
            135deg,
            #ddd,
            #777
        );

    z-index: 81;

    pointer-events: none;

    animation:
        rocketPiece
        1.1s
        ease-out
        forwards;
}


@keyframes rocketPiece {

    0% {

        transform:
            translate(-50%, -50%)
            rotate(0)
            scale(1);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(720deg)
            scale(.1);

        opacity: 0;
    }
}


/* =====================================================
   KALP PARÇACIKLARI
===================================================== */

#heartLayer {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 90;
}


.heart {

    position: fixed;

    left: 50%;
    top: 43%;

    opacity: 0;

    font-size: 18px;

    filter:
        drop-shadow(
            0 0 8px #ff1493
        );

    animation:
        heartForm
        2.2s
        cubic-bezier(.15,.8,.2,1)
        forwards;
}


@keyframes heartForm {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.1);

        opacity: 0;
    }

    15% {

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(var(--scale));

        opacity: 1;
    }
}


/* =====================================================
   ARKA SİLİK BÜYÜK KALP
===================================================== */

#bigHeart {

    position: fixed;

    left: 50%;
    top: 43%;

    width:
        clamp(180px, 58vw, 340px);

    height:
        clamp(180px, 58vw, 340px);

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 105;

    display: flex;

    justify-content: center;
    align-items: center;

    pointer-events: none;
}


/*
    Büyük silik kalbin kendisi
*/

#bigHeart::before {

    content: "❤";

    position: absolute;

    font-size:
        clamp(180px, 58vw, 340px);

    color:
        #ff1493;

    opacity: .16;

    filter:
        blur(2px)
        drop-shadow(0 0 20px #ff1493)
        drop-shadow(0 0 60px #ff1493);

    transform:
        scale(1.1);
}


#bigHeart.big-heart-active {

    animation:
        backgroundHeart
        3.5s
        ease
        forwards;
}


@keyframes backgroundHeart {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.15);

        opacity: 0;
    }

    35% {

        transform:
            translate(-50%, -50%)
            scale(1.05);

        opacity: 1;
    }

    55% {

        transform:
            translate(-50%, -50%)
            scale(.96);

        opacity: 1;
    }

    70% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}


/* =====================================================
   İÇİNDEN ÇIKAN KALP
===================================================== */

#innerHeart {

    position: fixed;

    left: 50%;
    top: 43%;

    z-index: 120;

    font-size:
        clamp(45px, 17vw, 105px);

    color:
        #ff174f;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0);

    pointer-events: none;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 18px #ff1493)
        drop-shadow(0 0 40px #ff1493)
        drop-shadow(0 0 75px #ff1493);
}


.inner-heart-active {

    animation:
        innerHeartBirth
        2.4s
        cubic-bezier(.15,.8,.2,1)
        forwards;
}


@keyframes innerHeartBirth {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    25% {

        transform:
            translate(-50%, -50%)
            scale(.35);

        opacity: 1;
    }

    45% {

        transform:
            translate(-50%, -50%)
            scale(.85);

        opacity: 1;
    }

    58% {

        transform:
            translate(-50%, -50%)
            scale(.72);
    }

    70% {

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    80% {

        transform:
            translate(-50%, -50%)
            scale(.94);
    }

    90% {

        transform:
            translate(-50%, -50%)
            scale(1.07);
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}


/* =====================================================
   KALP NABIZ HALKALARI
===================================================== */

.heart-ring {

    position: fixed;

    left: 50%;
    top: 43%;

    width: 70px;
    height: 70px;

    transform:
        translate(-50%, -50%)
        scale(.2);

    border-radius: 50%;

    border:
        2px solid
        rgba(255,20,147,.7);

    box-shadow:
        0 0 15px #ff1493,
        inset 0 0 10px #ff1493;

    opacity: 0;

    pointer-events: none;

    z-index: 110;
}


.heart-ring.active {

    animation:
        heartRing
        1.4s
        ease-out
        forwards;
}


@keyframes heartRing {

    0% {

        transform:
            translate(-50%, -50%)
            scale(.2);

        opacity: .9;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(4.5);

        opacity: 0;
    }
}


/* =====================================================
   KALP PARLAMASI
===================================================== */

.heart-glow {

    position: fixed;

    left: 50%;
    top: 43%;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background:
        white;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 119;

    pointer-events: none;

    filter:
        blur(5px);
}


.heart-glow.active {

    animation:
        heartGlow
        2.4s
        ease
        forwards;
}


@keyframes heartGlow {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    30% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: .9;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(2.5);

        opacity: .4;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }
}


/* =====================================================
   SON YAZI
===================================================== */

#finalMessage {

    position: fixed;

    left: 50%;
    top: 80%;

    width: 90%;

    transform:
        translateX(-50%);

    z-index: 150;

    text-align: center;

    font-size:
        clamp(25px, 6vw, 50px);

    font-weight: bold;

    color: white;

    opacity: 0;

    text-shadow:
        0 0 10px #ff4fa3,
        0 0 30px #ff1493,
        0 0 60px #ff1493;

    animation:
        finalText
        1.2s
        ease
        forwards;
}


@keyframes finalText {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =====================================================
   EKRAN SARSINTISI
===================================================== */

.shake {

    animation:
        shake .45s ease;
}


@keyframes shake {

    0% {
        transform: translate(0,0);
    }

    20% {
        transform: translate(-12px,7px);
    }

    40% {
        transform: translate(10px,-8px);
    }

    60% {
        transform: translate(-8px,-5px);
    }

    80% {
        transform: translate(8px,6px);
    }

    100% {
        transform: translate(0,0);
    }
}


/* =====================================================
   GENEL ANİMASYONLAR
===================================================== */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            scale(.5);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


@keyframes blink {

    0%,100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }
}


@keyframes countdownAppear {

    from {

        transform:
            scale(1.8);

        opacity: 0;
    }

    to {

        transform:
            scale(1);

        opacity: 1;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     ANA EKRAN
===================================================== -->

<div id="screen">

    <div id="content">

        <div class="tap">
            Ekrana tıkla ❤️
        </div>

    </div>

</div>


<!-- =====================================================
     ROKET
===================================================== -->

<div id="rocket">

    <div class="rocket-wing left"></div>

    <div class="rocket-wing right"></div>

    <div class="rocket-body">

        <div class="rocket-nose"></div>

        <div class="rocket-window"></div>

        <div class="rocket-line"></div>

    </div>

    <div class="rocket-engine"></div>

</div>


<!-- Roket ateşi -->

<div id="flame">

    <div class="flame-core"></div>

</div>


<!-- Patlama -->

<div id="blast"></div>


<!-- Kalp parçacıkları -->

<div id="heartLayer"></div>


<!-- Silik büyük kalp -->

<div id="bigHeart"></div>


<!-- İçinden çıkan kalp -->

<div id="innerHeart">
    ❤️
</div>


<!-- Kalp ışığı -->

<div class="heart-glow"
     id="heartGlow">
</div>


<script>


/* =====================================================
   ELEMENTLER
===================================================== */

const screen =
    document.getElementById("screen");

const content =
    document.getElementById("content");

const rocket =
    document.getElementById("rocket");

const flame =
    document.getElementById("flame");

const blast =
    document.getElementById("blast");

const heartLayer =
    document.getElementById("heartLayer");

const bigHeart =
    document.getElementById("bigHeart");


let step = 0;

let finished = false;


/* =====================================================
   MESAJLAR
===================================================== */

const messages = [

    "Tıkla Fatih... ❤️",

    "Sana bir şey söyleyeceğim...",

    "İyi ki...",

    "İyi ki seni tanımışım... 🥹",

    "Seni çok seviyorum...",

    "Pampimmmmmmm ❤️"

];


/* =====================================================
   TIKLAMA
===================================================== */

screen.addEventListener(
    "click",
    function() {


        if (finished)
            return;


        if (step < messages.length) {


            /*
                PAMPİM ÖZEL
            */

            if (
                step ===
                messages.length - 1
            ) {


                content.innerHTML = `

                    <div id="pampimArea">

                        <div class="message">
                            Pampimmmmmmm ❤️
                        </div>

                        <div id="countdown">
                            7
                        </div>

                    </div>

                `;


                step++;


                /*
                    PAMPİM GELDİĞİ
                    ANDA SAYIM BAŞLIYOR
                */

                startCountdown();


                return;
            }


            content.innerHTML = `

                <div class="message">
                    ${messages[step]}
                </div>

            `;


            step++;

        }

    }
);


/* =====================================================
   GERİ SAYIM
===================================================== */

function startCountdown() {

    let number = 7;


    const counter =
        setInterval(
            function() {


                number--;


                if (number > 0) {


                    const countdown =
                        document.getElementById(
                            "countdown"
                        );


                    if (countdown) {


                        countdown.textContent =
                            number;


                        countdown.style.animation =
                            "none";


                        void countdown.offsetWidth;


                        countdown.style.animation =
                            "countdownAppear .8s ease";

                    }

                }


                else {


                    clearInterval(
                        counter
                    );


                    content.innerHTML =
                        "";


                    launchRocket();

                }


            },
            1000
        );
}


/* =====================================================
   ROKET FIRLAT
===================================================== */

function launchRocket() {


    finished = true;


    rocket.classList.add(
        "rocket-active"
    );


    flame.classList.add(
        "flame-active"
    );


    /*
        Roket uçarken duman
    */

    const smokeTimer =
        setInterval(
            function() {


                if (
                    rocket.style.display ===
                    "none"
                ) {

                    clearInterval(
                        smokeTimer
                    );

                    return;
                }


                createSmoke();

            },
            65
        );


    /*
        Roket hedefe ulaştığında patlıyor
    */

    setTimeout(
        function() {


            clearInterval(
                smokeTimer
            );


            /*
                ROKET YOK OLUYOR
            */

            rocket.classList.remove(
                "rocket-active"
            );

            rocket.style.display =
                "none";


            flame.classList.remove(
                "flame-active"
            );

            flame.style.display =
                "none";


            /*
                PATLAMA
            */

            rocketExplosion();


        },
        2700
    );
}


/* =====================================================

function createSmoke() {


    const rect =
        rocket.getBoundingClientRect();


    const smoke =
        document.createElement(
            "div"
        );


    smoke.className =
        "smoke";


    smoke.style.left =

            rect.left +
            rect.width / 2
        ) + "px";


    smoke.style.top =
        (
            rect.bottom - 15
        ) + "px";


    document.body.appendChild(
        smoke

    setTimeout(

/* =====================================================
   MATEMATİKSEL KALP
===================================================== */

function heartEquation(t) {


    /*
        Kalp denklemi:

        x = 16 sin³(t)

        y =
        13cos(t)
        -5cos(2t)
        -2cos(3t)
        -cos(4t)
    */


    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        -(
            13 *
            Math.cos(t)

            -

            5 *
            Math.cos(2 * t)

            -

            2 *
            Math.cos(3 * t)

            -

            Math.cos(4 * t)
        );


    return {
        x: x,
        y: y
    };

}


/* =====================================================
   KALP OLUŞTUR
===================================================== */

function createHeart() {


    /*
        Kalbin dış çizgisi
    */

    const amount = 180;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const t =
            Math.PI * 2 *
            (i / amount);


        const point =
            heartEquation(t);


        createHeartParticle(
            point.x * 13,
            point.y * 13,
            i
        );

    }


    /*
        Kalbin içini doldur
    */

    for (
        let i = 0;
        i < 180;
        i++
    ) {


        const t =
            Math.random() *
            Math.PI * 2;


        const point =
            heartEquation(t);


        const inside =
            Math.random() * .95;


        createHeartParticle(

            point.x *
            13 *
            inside,

            point.y *
            13 *
            inside,

            i + 180

        );

    }


    /*
        =================================
        SİLİK BÜYÜK KALP
        =================================
    */

    setTimeout(
        function() {


            bigHeart.classList.add(
                "big-heart-active"
            );


        },
        900
    );


    /*
        =================================
        İÇ KALP ÇIKIYOR
        =================================
    */

    setTimeout(
        function() {


            const innerHeart =
                document.getElementById(
                    "innerHeart"
                );


            const glow =
                document.getElementById(
                    "heartGlow"
                );


            innerHeart.classList.add(
                "inner-heart-active"
            );


            glow.classList.add(
                "active"
            );


            createHeartRing();


        },
        1700
    );


    /*
        İKİNCİ NABIZ
    */

    setTimeout(
        function() {

            createHeartRing();

        },
        2500
    );


    /*
        ÜÇÜNCÜ NABIZ
    */

    setTimeout(
        function() {

            createHeartRing();

        },
        3300
    );


    /*
        SON YAZI
    */

    setTimeout(
        function() {


            const finalText =
                document.createElement(
                    "div"
                );


            finalText.id =
                "finalMessage";


            finalText.innerHTML =
                "Seni çok seviyorum Fatih ❤️";


            document.body.appendChild(
                finalText
            );


        },
        3900
    );
}


/* =====================================================
   KALP PARÇACIĞI
===================================================== */

function createHeartParticle(
    x,
    y,
    index
) {


    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "heart";


    const symbols = [

        "❤️",
        "💖",
        "💗",
        "💕",
        "💓"

    ];


    heart.innerHTML =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.setProperty(
        "--x",
        x + "px"
    );


    heart.style.setProperty(
        "--y",
        y + "px"
    );


    heart.style.setProperty(
        "--scale",
        (
            .4 +
            Math.random() * .7
        )
    );


    heart.style.animationDelay =
        (
            Math.random() * .25
        ) + "s";


    heartLayer.appendChild(
        heart
    );


    setTimeout(
        function() {

            heart.remove();

        },
        3000
    );
}
