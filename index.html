<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fatih ❤️</title>

<style>

/* =====================================================
   GENEL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 50% 100%,
            #35004f 0%,
            #100018 48%,
            #020005 100%
        );

    color: white;
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =====================================================
   YILDIZLAR
===================================================== */

#stars,
#stars2,
#stars3 {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;

    box-shadow:
        0 0 4px white,
        0 0 7px #ffb6e0;

    opacity: .7;

    animation:
        twinkle
        var(--duration)
        ease-in-out
        infinite;

    will-change: opacity, transform;
}

.star.big {
    width: 3px;
    height: 3px;

    box-shadow:
        0 0 5px white,
        0 0 10px #ff4fa3;
}

@keyframes twinkle {

    0%, 100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.25);
    }
}


/* =====================================================
   ANA EKRAN
===================================================== */

#screen {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    cursor: pointer;

    position: relative;
    z-index: 10;

    will-change: transform;
}

#content {
    position: relative;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    width: 100%;
}


/* =====================================================
   MESAJLAR
===================================================== */

.message {
    font-size: clamp(30px, 8vw, 58px);
    font-weight: bold;
    line-height: 1.3;

    text-shadow:
        0 0 8px #ff4fa3,
        0 0 20px #ff4fa3,
        0 0 35px #ff1493;

    animation:
        textEnter
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    will-change: transform, opacity;
}

@keyframes textEnter {

    0% {
        opacity: 0;
        transform:
            translateY(25px)
            scale(.85);
        filter: blur(5px);
    }

    60% {
        opacity: 1;
        transform:
            translateY(-4px)
            scale(1.03);
        filter: blur(0);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
        filter: blur(0);
    }
}

.tap {
    font-size: 22px;
    color: #ffd6ec;

    animation:
        blink
        1.2s
        infinite;
}


/* =====================================================
   PAMPİM + SAYIM
===================================================== */

#pampimArea {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;

    animation:
        textEnter
        .8s
        ease
        forwards;
}

#countdown {
    font-size: clamp(75px, 20vw, 130px);
    font-weight: bold;

    color: #ff4fa3;

    text-shadow:
        0 0 8px #ff4fa3,
        0 0 20px #ff1493,
        0 0 45px #ff1493;

    animation:
        countdownAppear
        .8s
        ease;

    will-change: transform, opacity;
}


/* =====================================================
   ROKET
===================================================== */

#rocket {
    position: fixed;

    left: 50%;
    bottom: -180px;

    width: 90px;
    height: 190px;

    transform: translateX(-50%);

    display: none;

    z-index: 50;

    will-change: bottom, transform;
}

.rocket-body {
    position: absolute;

    left: 50%;
    bottom: 30px;

    width: 55px;
    height: 125px;

    transform: translateX(-50%);

    border-radius: 50% 50% 18% 18%;

    background:
        linear-gradient(
            90deg,
            #555,
            #ddd 22%,
            white 50%,
            #ccc 70%,
            #555
        );

    box-shadow:
        inset 5px 0 8px rgba(255,255,255,.6),
        inset -5px 0 8px rgba(0,0,0,.3);
}

.rocket-nose {
    position: absolute;

    top: -30px;
    left: 0;

    width: 55px;
    height: 45px;

    background:
        linear-gradient(
            90deg,
            #666,
            #fff,
            #aaa
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.rocket-window {
    position: absolute;

    top: 27px;
    left: 50%;

    width: 25px;
    height: 25px;

    transform: translateX(-50%);

    border-radius: 50%;

    border: 4px solid #555;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #54d9ff 35%,
            #07559e 100%
        );

    box-shadow:
        0 0 8px #4fd6ff;
}

.rocket-line {
    position: absolute;

    left: 0;
    top: 67px;

    width: 100%;
    height: 6px;

    background: #ff164d;
}

.rocket-wing {
    position: absolute;

    bottom: 32px;

    width: 32px;
    height: 65px;

    background:
        linear-gradient(
            135deg,
            #ff315f,
            #81002d
        );

    z-index: -1;
}

.rocket-wing.left {
    left: 2px;
    transform: translateX(-22px);

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.rocket-wing.right {
    right: 2px;
    transform: translateX(22px);

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.rocket-engine {
    position: absolute;

    left: 50%;
    bottom: 15px;

    width: 30px;
    height: 25px;

    transform: translateX(-50%);

    background: #222;

    border-radius: 0 0 12px 12px;
}


/* =====================================================
   ALEV
===================================================== */

#flame {
    position: fixed;

    left: 50%;
    bottom: -55px;

    width: 45px;
    height: 110px;

    transform: translateX(-50%);

    display: none;

    z-index: 45;

    will-change: transform;
}

.flame-core {
    width: 30px;
    height: 100px;

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    border-radius: 50% 50% 70% 70%;

    background:
        linear-gradient(
            to bottom,
            white 0%,
            #fff700 20%,
            #ff8c00 55%,
            #ff1e00 100%
        );

    filter:
        blur(1.5px)
        drop-shadow(0 0 10px #ff7b00);
}

.flame-active {
    display: block;

    animation:
        flameShake
        .07s
        infinite
        alternate;
}

.rocket-active {
    display: block !important;

    animation:
        rocketFlight
        2.7s
        cubic-bezier(.25,.05,.15,1)
        forwards;
}

@keyframes rocketFlight {

    0% {
        bottom: -180px;
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    15% {
        transform:
            translateX(-50%)
            rotate(3deg);
    }

    30% {
        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    45% {
        transform:
            translateX(-50%)
            rotate(2deg);
    }

    60% {
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    80% {
        transform:
            translateX(-50%)
            rotate(1deg);
    }

    100% {
        bottom: 57%;
        transform:
            translateX(-50%)
            rotate(0deg);
    }
}

@keyframes flameShake {

    from {
        transform:
            translateX(-50%)
            scaleY(1);
    }

    to {
        transform:
            translateX(-50%)
            scaleY(.65);
    }
}


/* =====================================================
   DUMAN
===================================================== */

.smoke {
    position: fixed;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background:
        rgba(210,210,210,.35);

    filter: blur(4px);

    z-index: 10;

    pointer-events: none;

    animation:
        smoke
        .8s
        ease-out
        forwards;

    will-change: transform, opacity;
}

@keyframes smoke {

    0% {
        transform: scale(.5);
        opacity: .7;
    }

    100% {
        transform: scale(2.5);
        opacity: 0;
    }
}


/* =====================================================
   PATLAMA
===================================================== */

#blast {
    position: fixed;

    left: 50%;
    top: 43%;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 80;

    pointer-events: none;

    will-change: transform, opacity;
}

.blast-active {
    animation:
        blast
        1.1s
        ease-out
        forwards;
}

@keyframes blast {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.1);

        background: white;

        box-shadow:
            0 0 15px white;

        opacity: 1;
    }

    15% {
        transform:
            translate(-50%, -50%)
            scale(3);

        background: white;

        box-shadow:
            0 0 30px white,
            0 0 60px #ffe600,
            0 0 90px #ff6600;
    }

    35% {
        transform:
            translate(-50%, -50%)
            scale(7);

        background:
            radial-gradient(
                circle,
                #fff,
                #ffea00 25%,
                #ff7300 60%,
                #ff1700 100%
            );

        box-shadow:
            0 0 35px #ffcc00,
            0 0 80px #ff4500;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(25);

        opacity: 0;
    }
}


/* =====================================================
   ATEŞ TOPLARI
===================================================== */

.fireball {
    position: fixed;

    left: 50%;
    top: 43%;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            #fff000 20%,
            #ff8c00 55%,
            #ff1b00 100%
        );

    box-shadow:
        0 0 7px white,
        0 0 18px #ff8c00,
        0 0 30px #ff2600;

    z-index: 82;

    pointer-events: none;

    animation:
        fireballFly
        1.1s
        cubic-bezier(.1,.6,.2,1)
        forwards;

    will-change: transform, opacity;
}

@keyframes fireballFly {

    0% {
        transform:
            translate(-50%, -50%)
            scale(1.3);

        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity: 0;
    }
}


/* =====================================================
   KIVILCIM
===================================================== */

.spark {
    position: fixed;

    left: 50%;
    top: 43%;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px white,
        0 0 12px #ff8500;

    z-index: 84;

    pointer-events: none;

    animation:
        sparkFly
        1.2s
        ease-out
        forwards;

    will-change: transform, opacity;
}

@keyframes sparkFly {

    from {
        transform:
            translate(-50%, -50%)
            scale(1.3);

        opacity: 1;
    }

    to {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.1);

        opacity: 0;
    }
}


/* =====================================================
   ROKET PARÇALARI
===================================================== */

.rocket-piece {
    position: fixed;

    left: 50%;
    top: 43%;

    background:
        linear-gradient(
            135deg,
            #ddd,
            #777
        );

    z-index: 81;

    pointer-events: none;

    animation:
        rocketPiece
        1s
        ease-out
        forwards;

    will-change: transform, opacity;
}

@keyframes rocketPiece {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(0)
            scale(1);

        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(540deg)
            scale(.1);

        opacity: 0;
    }
}


/* =====================================================
   KALP PARÇACIKLARI
===================================================== */

#heartLayer {
    position: fixed;
    inset: 0;

    pointer-events: none;
    z-index: 90;
}

.heart {
    position: fixed;

    left: 50%;
    top: 43%;

    opacity: 0;

    font-size: 15px;

    filter:
        drop-shadow(0 0 5px #ff1493);

    animation:
        heartForm
        2.1s
        cubic-bezier(.15,.8,.2,1)
        forwards;

    will-change: transform, opacity;
}

@keyframes heartForm {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.1);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(var(--scale));

        opacity: 1;
    }
}


/* =====================================================
   BÜYÜK KALP
===================================================== */

#bigHeart {
    position: fixed;

    left: 50%;
    top: 43%;

    width: clamp(180px, 58vw, 340px);
    height: clamp(180px, 58vw, 340px);

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 105;

    display: flex;

    justify-content: center;
    align-items: center;

    pointer-events: none;

    will-change: transform, opacity;
}

#bigHeart::before {
    content: "❤";

    position: absolute;

    font-size:
        clamp(180px, 58vw, 340px);

    color: #ff1493;

    opacity: .13;

    filter:
        blur(1px)
        drop-shadow(0 0 15px #ff1493);
}

#bigHeart.big-heart-active {
    animation:
        backgroundHeart
        3.5s
        ease
        forwards;
}

@keyframes backgroundHeart {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.15);

        opacity: 0;
    }

    35% {
        transform:
            translate(-50%, -50%)
            scale(1.05);

        opacity: 1;
    }

    55% {
        transform:
            translate(-50%, -50%)
            scale(.96);

        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}


/* =====================================================
   İÇ KALP
===================================================== */

#innerHeart {
    position: fixed;

    left: 50%;
    top: 43%;

    z-index: 120;

    font-size:
        clamp(45px, 17vw, 105px);

    color: #ff174f;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0);

    pointer-events: none;

    filter:
        drop-shadow(0 0 7px white)
        drop-shadow(0 0 15px #ff1493)
        drop-shadow(0 0 30px #ff1493);

    will-change: transform, opacity;
}

.inner-heart-active {
    animation:
        innerHeartBirth
        2.4s
        cubic-bezier(.15,.8,.2,1)
        forwards;
}

@keyframes innerHeartBirth {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    25% {
        transform:
            translate(-50%, -50%)
            scale(.35);

        opacity: 1;
    }

    45% {
        transform:
            translate(-50%, -50%)
            scale(.85);
    }

    58% {
        transform:
            translate(-50%, -50%)
            scale(.72);
    }

    70% {
        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    80% {
        transform:
            translate(-50%, -50%)
            scale(.94);
    }

    90% {
        transform:
            translate(-50%, -50%)
            scale(1.07);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}

.inner-heart-pulse {
    animation:
        heartPulse
        .65s
        ease-in-out;
}

@keyframes heartPulse {

    0% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    20% {
        transform:
            translate(-50%, -50%)
            scale(1.16);
    }

    38% {
        transform:
            translate(-50%, -50%)
            scale(.95);
    }

    55% {
        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =====================================================
   KALP IŞIĞI
===================================================== */

.heart-glow {
    position: fixed;

    left: 50%;
    top: 43%;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 119;

    pointer-events: none;

    filter: blur(4px);
}

.heart-glow.active {
    animation:
        heartGlow
        2.4s
        ease
        forwards;
}

@keyframes heartGlow {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    30% {
        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: .8;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(2.2);

        opacity: .35;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }
}


/* =====================================================
   IŞIK PARÇACIKLARI
===================================================== */

.light-particle {
    position: fixed;

    left: 50%;
    top: 43%;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px white,
        0 0 12px #ff4fa3;

    z-index: 125;

    pointer-events: none;

    animation:
        lightFly
        1.4s
        ease-out
        forwards;

    will-change: transform, opacity;
}

@keyframes lightFly {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.2);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.05);

        opacity: 0;
    }
}


/* =====================================================
   UÇAN KÜÇÜK KALPLER
===================================================== */

.floating-heart {
    position: fixed;

    bottom: -40px;

    font-size: var(--size);

    opacity: 0;

    z-index: 95;

    pointer-events: none;

    filter:
        drop-shadow(0 0 5px #ff1493);

    animation:
        floatHeart
        var(--duration)
        linear
        forwards;

    will-change: transform, opacity;
}

@keyframes floatHeart {

    0% {
        transform:
            translateX(0)
            translateY(0)
            rotate(0)
            scale(.5);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    50% {
        transform:
            translateX(var(--drift))
            translateY(-50vh)
            rotate(25deg)
            scale(1);
    }

    100% {
        transform:
            translateX(calc(var(--drift) * -1))
            translateY(-115vh)
            rotate(-25deg)
            scale(.7);

        opacity: 0;
    }
}


/* =====================================================
   FINAL YAZISI
===================================================== */

#finalMessage {
    position: fixed;

    left: 50%;
    top: 67%;

    width: 94%;

    transform:
        translateX(-50%);

    z-index: 150;

    text-align: center;

    opacity: 0;

    animation:
        finalText
        1.2s
        ease
        forwards;
}

.final-main {
    font-size:
        clamp(25px, 6vw, 50px);

    font-weight: bold;

    color: white;

    text-shadow:
        0 0 8px #ff4fa3,
        0 0 20px #ff1493,
        0 0 40px #ff1493;
}

@keyframes finalText {

    from {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(25px);
    }

    to {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =====================================================
   SARSINTI
===================================================== */

.shake {
    animation:
        shake
        .45s
        ease;
}

@keyframes shake {

    0% {
        transform: translate(0,0);
    }

    20% {
        transform: translate(-8px,5px);
    }

    40% {
        transform: translate(7px,-6px);
    }

    60% {
        transform: translate(-6px,-4px);
    }

    80% {
        transform: translate(6px,5px);
    }

    100% {
        transform: translate(0,0);
    }
}


/* =====================================================
   DİĞER
===================================================== */

@keyframes blink {

    0%,100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }
}

@keyframes countdownAppear {

    from {
        transform: scale(1.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}


/* =====================================================
   MOBİL OPTİMİZASYONU
===================================================== */

@media (max-width: 600px) {

    .message {
        text-shadow:
            0 0 7px #ff4fa3,
            0 0 15px #ff1493;
    }

    #innerHeart {
        filter:
            drop-shadow(0 0 5px white)
            drop-shadow(0 0 12px #ff1493);
    }

    #bigHeart::before {
        filter:
            drop-shadow(0 0 12px #ff1493);
    }

    .heart,
    .floating-heart {
        filter:
            drop-shadow(0 0 4px #ff1493);
    }
}


/* =====================================================
   HAREKET AZALTMA
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>

<body>


<!-- YILDIZLAR -->

<div id="stars"></div>
<div id="stars2"></div>
<div id="stars3"></div>


<!-- ANA EKRAN -->

<div id="screen">

    <div id="content">

        <div class="tap">
            Ekrana tıkla ❤️
        </div>

    </div>

</div>


<!-- ROKET -->

<div id="rocket">

    <div class="rocket-wing left"></div>
    <div class="rocket-wing right"></div>

    <div class="rocket-body">

        <div class="rocket-nose"></div>

        <div class="rocket-window"></div>

        <div class="rocket-line"></div>

    </div>

    <div class="rocket-engine"></div>

</div>


<div id="flame">
    <div class="flame-core"></div>
</div>


<div id="blast"></div>

<div id="heartLayer"></div>

<div id="bigHeart"></div>

<div id="innerHeart">
    ❤️
</div>

<div
    class="heart-glow"
    id="heartGlow">
</div>


<script>

/* =====================================================
   YILDIZLAR
   Öncekinden daha az element
===================================================== */

function createStars(layerId, amount) {

    const layer =
        document.getElementById(layerId);

    const fragment =
        document.createDocumentFragment();

    for (let i = 0; i < amount; i++) {

        const star =
            document.createElement("div");

        star.className = "star";

        if (Math.random() > .88) {
            star.classList.add("big");
        }

        star.style.left =
            Math.random() * 100 + "vw";

        star.style.top =
            Math.random() * 100 + "vh";

        star.style.setProperty(
            "--duration",
            (
                1.8 +
                Math.random() * 2.5
            ) + "s"
        );

        star.style.animationDelay =
            Math.random() * 3 + "s";

        fragment.appendChild(star);
    }

    layer.appendChild(fragment);
}


/*
    Toplam:
    160 yerine 85 yıldız
*/

createStars("stars", 45);
createStars("stars2", 25);
createStars("stars3", 15);


/* =====================================================
   ELEMENTLER
===================================================== */

const screen =
    document.getElementById("screen");

const content =
    document.getElementById("content");

const rocket =
    document.getElementById("rocket");

const flame =
    document.getElementById("flame");

const blast =
    document.getElementById("blast");

const heartLayer =
    document.getElementById("heartLayer");

const bigHeart =
    document.getElementById("bigHeart");


let step = 0;

let finished = false;


/* =====================================================
   MESAJLAR
===================================================== */

const messages = [

    "Tıkla Fatih... ❤️",

    "Sana bir şey söyleyeceğim...",

    "İyi ki...",

    "İyi ki seni tanımışım... 🥹",

    "Seni çok seviyorum..."

];


/* =====================================================
   MESAJ GÖSTER
===================================================== */

function showMessage(text) {

    content.innerHTML = "";

    const message =
        document.createElement("div");

    message.className =
        "message";

    message.textContent =
        text;

    content.appendChild(message);
}


/* =====================================================
   TIKLAMA
===================================================== */

screen.addEventListener(
    "click",
    function() {

        if (finished)
            return;


        if (step === messages.length) {

            content.innerHTML = `

                <div id="pampimArea">

                    <div class="message">
                        Pampimmmmmmm ❤️
                    </div>

                    <div id="countdown">
                        7
                    </div>

                </div>

            `;

            step++;

            startCountdown();

            return;
        }


        if (step < messages.length) {

            showMessage(
                messages[step]
            );

            step++;
        }

    },
    { passive: true }
);


/* =====================================================
   GERİ SAYIM
===================================================== */

function startCountdown() {

    let number = 7;

    const counter =
        setInterval(
            function() {

                number--;

                if (number > 0) {

                    const countdown =
                        document.getElementById(
                            "countdown"
                        );

                    if (countdown) {

                        countdown.textContent =
                            number;

                        countdown.style.animation =
                            "none";

                        void countdown.offsetWidth;

                        countdown.style.animation =
                            "countdownAppear .8s ease";
                    }

                } else {

                    clearInterval(counter);

                    content.innerHTML = "";

                    launchRocket();
                }

            },
            1000
        );
}


/* =====================================================
   ROKET
===================================================== */

function launchRocket() {

    finished = true;

    rocket.style.display = "block";

    rocket.classList.add(
        "rocket-active"
    );

    flame.classList.add(
        "flame-active"
    );


    const smokeTimer =
        setInterval(
            createSmoke,
            100
        );


    setTimeout(
        function() {

            clearInterval(
                smokeTimer
            );

            rocket.classList.remove(
                "rocket-active"
            );

            rocket.style.display =
                "none";

            flame.classList.remove(
                "flame-active"
            );

            flame.style.display =
                "none";

            rocketExplosion();

        },
        2700
    );
}


/* =====================================================
   DUMAN
===================================================== */

function createSmoke() {

    if (
        rocket.style.display ===
        "none"
    )
        return;


    const rect =
        rocket.getBoundingClientRect();


    const smoke =
        document.createElement(
            "div"
        );

    smoke.className =
        "smoke";


    smoke.style.left =
        (
            rect.left +
            rect.width / 2
        ) + "px";


    smoke.style.top =
        (
            rect.bottom - 15
        ) + "px";


    document.body.appendChild(
        smoke
    );


    setTimeout(
        function() {
            smoke.remove();
        },
        800
    );
}


/* =====================================================
   PATLAMA
===================================================== */

function rocketExplosion() {

    screen.classList.add(
        "shake"
    );

    setTimeout(
        function() {

            screen.classList.remove(
                "shake"
            );

        },
        450
    );


    blast.classList.remove(
        "blast-active"
    );

    void blast.offsetWidth;

    blast.classList.add(
        "blast-active"
    );


    /*
        Önceden:
        42 + 90 + 10

        Şimdi:
        20 + 35 + 5
    */

    for (let i = 0; i < 20; i++) {
        createFireball();
    }

    for (let i = 0; i < 35; i++) {
        createSpark();
    }

    for (let i = 0; i < 5; i++) {
        createRocketPiece();
    }


    setTimeout(
        createHeart,
        650
    );
}


/* =====================================================
   ATEŞ TOPU
===================================================== */

function createFireball() {

    const ball =
        document.createElement(
            "div"
        );

    ball.className =
        "fireball";


    const angle =
        Math.random() *
        Math.PI * 2;


    const distance =
        90 +
        Math.random() * 260;


    ball.style.setProperty(
        "--x",
        Math.cos(angle) *
        distance +
        "px"
    );


    ball.style.setProperty(
        "--y",
        Math.sin(angle) *
        distance +
        "px"
    );


    document.body.appendChild(
        ball
    );


    setTimeout(
        function() {
            ball.remove();
        },
        1150
    );
}


/* =====================================================
   KIVILCIM
===================================================== */

function createSpark() {

    const spark =
        document.createElement(
            "div"
        );

    spark.className =
        "spark";


    const angle =
        Math.random() *
        Math.PI * 2;


    const distance =
        70 +
        Math.random() * 330;


    spark.style.setProperty(
        "--x",
        Math.cos(angle) *
        distance +
        "px"
    );


    spark.style.setProperty(
        "--y",
        Math.sin(angle) *
        distance +
        "px"
    );


    document.body.appendChild(
        spark
    );


    setTimeout(
        function() {
            spark.remove();
        },
        1250
    );
}


/* =====================================================
   ROKET PARÇASI
===================================================== */

function createRocketPiece() {

    const piece =
        document.createElement(
            "div"
        );

    piece.className =
        "rocket-piece";


    piece.style.width =
        (
            6 +
            Math.random() * 12
        ) + "px";


    piece.style.height =
        (
            6 +
            Math.random() * 12
        ) + "px";


    const angle =
        Math.random() *
        Math.PI * 2;


    const distance =
        90 +
        Math.random() * 220;


    piece.style.setProperty(
        "--x",
        Math.cos(angle) *
        distance +
        "px"
    );


    piece.style.setProperty(
        "--y",
        Math.sin(angle) *
        distance +
        "px"
    );


    document.body.appendChild(
        piece
    );


    setTimeout(
        function() {
            piece.remove();
        },
        1100
    );
}


/* =====================================================
   MATEMATİKSEL KALP
===================================================== */

function heartEquation(t) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        -(
            13 *
            Math.cos(t)

            -

            5 *
            Math.cos(2 * t)

            -

            2 *
            Math.cos(3 * t)

            -

            Math.cos(4 * t)
        );


    return {
        x: x,
        y: y
    };
}


/* =====================================================
   ANA KALP
===================================================== */

function createHeart() {

    /*
        180 -> 90 dış kalp
        180 -> 70 iç kalp

        Toplam:
        160 yerine 360
        daha az kalp
    */

    const amount = 90;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const t =
            Math.PI * 2 *
            (i / amount);


        const point =
            heartEquation(t);


        createHeartParticle(
            point.x * 13,
            point.y * 13
        );
    }


    /*
        Kalbin içi
    */

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const t =
            Math.random() *
            Math.PI * 2;


        const point =
            heartEquation(t);


        const inside =
            Math.random() * .95;


        createHeartParticle(

            point.x *
            13 *
            inside,

            point.y *
            13 *
            inside

        );
    }


    /*
        Büyük kalp
    */

    setTimeout(
        function() {

            bigHeart.classList.add(
                "big-heart-active"
            );

        },
        900
    );


    /*
        İç kalp
    */

    setTimeout(
        function() {

            const innerHeart =
                document.getElementById(
                    "innerHeart"
                );


            const glow =
                document.getElementById(
                    "heartGlow"
                );


            innerHeart.classList.add(
                "inner-heart-active"
            );


            glow.classList.add(
                "active"
            );


            createLightParticles(20);

        },
        1700
    );


    /*
        Kalp atışları
    */

    setTimeout(
        pulseHeart,
        2800
    );

    setTimeout(
        pulseHeart,
        3500
    );

    setTimeout(
        pulseHeart,
        4200
    );


    /*
        Final yazısı
    */

    setTimeout(
        function() {

            const finalText =
                document.createElement(
                    "div"
                );


            finalText.id =
                "finalMessage";


            finalText.innerHTML = `

                <div class="final-main">
                    Seni çok seviyorum Pampim ❤️
                </div>

            `;


            document.body.appendChild(
                finalText
            );

        },
        3000
    );


    /*
        Uçan kalpler
    */

    setTimeout(
        startFloatingHearts,
        3200
    );
}


/* =====================================================
   KALP PARÇACIĞI
===================================================== */

function createHeartParticle(x, y) {

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "heart";


    const symbols = [
        "❤️",
        "💖",
        "💗",
        "💕",
        "💓"
    ];


    heart.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.setProperty(
        "--x",
        x + "px"
    );


    heart.style.setProperty(
        "--y",
        y + "px"
    );


    heart.style.setProperty(
        "--scale",
        (
            .4 +
            Math.random() * .6
        )
    );


    heart.style.animationDelay =
        (
            Math.random() * .2
        ) + "s";


    heartLayer.appendChild(
        heart
    );


    setTimeout(
        function() {
            heart.remove();
        },
        2800
    );
}


/* =====================================================
   KALP ATIŞI
===================================================== */

function pulseHeart() {

    const innerHeart =
        document.getElementById(
            "innerHeart"
        );


    if (!innerHeart)
        return;


    innerHeart.classList.remove(
        "inner-heart-pulse"
    );


    void innerHeart.offsetWidth;


    innerHeart.classList.add(
        "inner-heart-pulse"
    );


    createLightParticles(8);
}


/* =====================================================
   IŞIK PARÇACIKLARI
===================================================== */

function createLightParticles(amount) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "light-particle";


        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            60 +
            Math.random() * 160;


        particle.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        particle.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        particle.style.animationDelay =
            (
                Math.random() * .25
            ) + "s";


        document.body.appendChild(
            particle
        );


        setTimeout(
            function() {
                particle.remove();
            },
            1700
        );
    }
}


/* =====================================================
   UÇAN KALPLER
===================================================== */

function startFloatingHearts() {

    let count = 0;


    const timer =
        setInterval(
            function() {

                createFloatingHeart();

                count++;


                if (count >= 7) {

                    clearInterval(
                        timer
                    );

                }

            },
            600
        );
}


/* =====================================================
   TEK UÇAN KALP
===================================================== */

function createFloatingHeart() {

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "floating-heart";


    heart.textContent =
        Math.random() > .5
        ? "❤️"
        : "💗";


    heart.style.left =
        (
            5 +
            Math.random() * 90
        ) + "vw";


    heart.style.setProperty(
        "--size",
        (
            12 +
            Math.random() * 18
        ) + "px"
    );


    heart.style.setProperty(
        "--duration",
        (
            4 +
            Math.random() * 3
        ) + "s"
    );


    heart.style.setProperty(
        "--drift",
        (
            -70 +
            Math.random() * 140
        ) + "px"
    );


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {
            heart.remove();
        },
        7500
    );
}

</script>

</body>
</html>
